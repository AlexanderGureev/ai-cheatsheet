<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Рабочий процесс с AI · E · Objects</title>
    <!--
  ВАРИАНТ E · OBJECTS — «предметы на столе»
  Студийная предметная съёмка: серая бесконечная поверхность, мягкий студийный свет, контактные тени,
  глубина резкости, один сигнальный цвет — оранжевый. Каждый блок — физический предмет с выносками,
  как в спецификации продукта. Обзор — наклонный кадр стола с подиумами групп разной высоты и медленным
  дрейфом камеры; фокус — продуктовый кадр в той же серой студии: предмет отделяют прожектор,
  виньетка и расфокус фона. «Главное» — отъезд на весь стол, предметы всех блоков вспыхивают по очереди.

  ФИШКА: предметы механически отыгрывают рассказ. Поворотный переключатель щёлкает по шагам цикла
  (и в обзоре, синхронно с цепочкой в hero), слои архитектуры разъезжаются в exploded view, модули
  встают в гнёзда платы, листы блокнота отрываются, клавиши нажимаются, карточки выдвигаются из картотеки,
  штампы ставят отметки, бруски проектов вырастают по одному с отсчётом строк.

  СТУДИЯ: свет и блики — bloom только по эмиссии (светодиоды, экраны, импульс кабеля), GTAO в щелях,
  мягкие тени VSM, пробег блика софтбокса при посадке камеры, рисунок окна (ProjectorLight) в обзоре,
  отражения окружения в фокусе (CubeCamera + SSR), лупа-линза с увеличением кода и каустикой,
  микрорельеф и неоднородная шероховатость материалов, анизотропная шлифовка, шелкография, фурнитура.

  Весь текст — в объекте CONTENT в начале скрипта. Геометрия, материалы, окружение и текстуры —
  процедурные
  Клавиши: → ↓ PgDn Space — вперёд, ← ↑ PgUp — назад, цифры — блок, G — главное, Esc — обзор,
  I — источники (панель ссылок, кнопка в левом нижнем углу), F — полный экран, R — интро, H — подсказка. ?debug — fps, p95, DPR и эффекты; ?webgl — WebGL2;
  ?slow — анимации ×0,25; ?uncap — без ограничения 60 fps и без адаптации DPR (для замеров); ?dpr=1.5 — DPR.
  Мышь: колесо — зум к курсору; трекпад: два пальца — сдвиг, щипок — зум; перетаскивание — сдвиг.
-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --u: min(calc(100vw / 1920), calc(100vh / 1080));
        --or: #ff5a1a;
        --or2: #ff7a3d;
        --ink: #131313;
        --ink2: #2f2f2f;
        --ink3: #4f4f4f;
        --fT: "Inter Tight", "Inter", system-ui, sans-serif;
        --fB: "Inter", system-ui, sans-serif;
        --fM: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1b1a;
      }
      body {
        font-family: var(--fB);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      body.nocursor,
      body.nocursor * {
        cursor: none !important;
      }
      #gl {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #gl.on {
        opacity: 1;
      }
      code,
      .mono {
        font-family: var(--fM);
        font-size: 0.92em;
        letter-spacing: -0.01em;
      }

      /* ---------- loader ---------- */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: #1b1b1a;
        transition: opacity 0.7s ease 0.1s;
      }
      #loader.out {
        opacity: 0;
        pointer-events: none;
      }
      .ld {
        display: grid;
        justify-items: center;
        gap: 28px;
      }
      .ld-dial {
        position: relative;
        width: 92px;
        height: 92px;
      }
      .ld-dial i {
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #3a3a38;
        left: 42.5px;
        top: 42.5px;
        transition:
          background 0.25s,
          box-shadow 0.25s;
      }
      .ld-dial i:nth-child(1) {
        transform: translate(0, -46px);
      }
      .ld-dial i:nth-child(2) {
        transform: translate(46px, 0);
      }
      .ld-dial i:nth-child(3) {
        transform: translate(0, 46px);
      }
      .ld-dial i:nth-child(4) {
        transform: translate(-46px, 0);
      }
      .ld-dial i.on {
        background: var(--or);
        box-shadow: 0 0 12px 2px rgba(255, 90, 26, 0.55);
      }
      .ld-knob {
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 38%, #3b3b39, #232322 70%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 10px 22px rgba(0, 0, 0, 0.45);
        animation: ldTurn 2.4s steps(1, end) infinite;
      }
      .ld-knob:after {
        content: "";
        position: absolute;
        left: 50%;
        top: 7px;
        width: 3px;
        height: 20px;
        margin-left: -1.5px;
        border-radius: 2px;
        background: var(--or);
      }
      @keyframes ldTurn {
        0% {
          transform: rotate(0);
        }
        25% {
          transform: rotate(90deg);
        }
        50% {
          transform: rotate(180deg);
        }
        75% {
          transform: rotate(270deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .ld-t {
        font: 500 11px/1 var(--fM);
        letter-spacing: 0.24em;
        color: #8b8b86;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.4s;
      }
      .fonts .ld-t {
        opacity: 1;
      }
      .ld-err {
        font: 500 12px/1.5 var(--fM);
        color: #c9c9c4;
        max-width: 420px;
        text-align: center;
        display: none;
      }

      /* ---------- world labels (overview) ---------- */
      #world {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        overflow: hidden;
      }
      .wl {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      .wl > .z {
        transform-origin: 0 0;
      }
      /* ловит указатель только видимый блок текста: .z сдвинут transform'ом, а рамка самого .wl осталась бы под подписью */
      .wl.hit {
        cursor: pointer;
      }
      .wl.hit > .z {
        pointer-events: auto;
      }
      .wl.off {
        visibility: hidden;
      }

      .lb .z {
        width: var(--w);
        transform: translateY(-100%);
      }
      .lb-meta {
        display: flex;
        align-items: center;
        gap: 9px;
        font: 500 12.5px/1 var(--fM);
        letter-spacing: 0.1em;
        color: #3f3f3d;
        margin-bottom: 9px;
        text-transform: uppercase;
      }
      .lb-meta b {
        font-weight: 600;
        color: var(--ink);
      }
      .lb-meta i {
        width: 7px;
        height: 7px;
        border-radius: 1.5px;
        background: var(--or);
        display: inline-block;
      }
      .lb-title {
        font: 600 27px/1.05 var(--fT);
        letter-spacing: -0.02em;
        color: var(--ink);
        margin-bottom: 8px;
        transition: color 0.3s;
        text-wrap: balance;
      }
      .lb-thesis {
        font: 450 18px/1.32 var(--fB);
        color: #242423;
        text-wrap: pretty;
      }
      .lb-thesis code {
        font-size: 0.9em;
      }
      .lb:hover .lb-title,
      .lb.hov .lb-title {
        color: #000;
      }
      .lb .ul {
        display: block;
        height: 2px;
        width: 0;
        background: var(--or);
        margin: -3px 0 6px;
        transition: width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .lb.hov .ul {
        width: 36px;
      }

      .grp .z {
        font: 600 13.5px/1 var(--fM);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #141413;
        display: flex;
        flex-direction: column;
        gap: 5px;
        white-space: nowrap;
      }
      .grp .z span {
        color: #2e2e2c;
        font-weight: 500;
      }

      .hero .z {
        width: 500px;
      }
      /* заголовок: еле заметный вертикальный градиент белый → цвет кости (как печать на студийном полу), без обводок;
   светлее пола (контраст ≥ 3:1 даже внизу букв) — выделяется среди тёмных подписей; мягкая тень едва отделяет его от пола */
      .h-title {
        font: 700 50px/0.96 var(--fT);
        letter-spacing: -0.045em;
        color: #f4f2ee;
        white-space: nowrap;
        padding-bottom: 0.14em;
        margin-bottom: -0.14em;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #f4f2ee 45%,
          #d9d6d0 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 1px 1.5px rgba(40, 30, 20, 0.16));
      }
      .h-sub {
        font: 500 21px/1.3 var(--fT);
        letter-spacing: -0.01em;
        color: #252524;
        margin-top: 12px;
      }
      .h-chain {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 6px;
        margin-top: 14px;
        font: 500 13px/1 var(--fM);
        letter-spacing: 0.03em;
        color: #232322;
      }
      .h-chain span {
        padding: 7px 9px 7px 9px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.42);
        border: 1px solid rgba(0, 0, 0, 0.07);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition:
          background 0.25s,
          color 0.25s,
          border-color 0.25s;
      }
      .h-chain span i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #9a9a95;
        transition:
          background 0.25s,
          box-shadow 0.25s;
      }
      .h-chain span.on {
        background: #151515;
        color: #f4f4f0;
        border-color: #151515;
      }
      .h-chain span.on i {
        background: var(--or);
        box-shadow: 0 0 6px rgba(255, 90, 26, 0.9);
      }
      .h-chain em {
        font-style: normal;
        color: #7b7b76;
      }
      .h-quote {
        font: 500 18px/1.36 var(--fB);
        color: #1c1c1b;
        margin-top: 16px;
        max-width: 330px;
        text-wrap: pretty;
      }
      .h-src {
        font: 500 13px/1.3 var(--fM);
        color: #3a3a37;
        margin-top: 8px;
        letter-spacing: 0.01em;
      }

      .foot .z {
        font: 500 14px/1 var(--fM);
        color: #1c1c1b;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .tag .z {
        font: 600 14.5px/1.15 var(--fT);
        color: #151515;
        white-space: nowrap;
        letter-spacing: -0.005em;
        text-align: center;
      }
      .tag .z b {
        font-weight: 600;
        color: #111;
      }
      .tag .z span {
        display: block;
        color: #2e2e2c;
        font: 600 16px/1.1 var(--fT);
        margin-top: 4px;
      }

      /* part labels (focus) */
      #parts {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }
      .pl {
        position: absolute;
        left: 0;
        top: 0;
        font: 500 max(15px, calc(19 * var(--u)))/1.1 var(--fM);
        letter-spacing: 0.02em;
        color: #ecece7;
        white-space: nowrap;
        opacity: 0;
        transition: color 0.3s;
        will-change: transform, opacity;
      }
      .pl.cur {
        color: #fff;
      }
      .pl.c .k {
        font-size: max(13px, calc(16 * var(--u)));
        padding: calc(5 * var(--u)) calc(8 * var(--u));
        background: rgba(18, 18, 17, 0.8);
        border-color: rgba(255, 255, 255, 0.14);
      }
      .pl .cnt {
        display: block;
        font: 600 max(17px, calc(23 * var(--u)))/1.1 var(--fT);
        letter-spacing: -0.01em;
        margin-top: calc(3 * var(--u));
        color: #fff;
      }
      .pl .cnt:empty {
        display: none;
      }
      .pl.bar {
        font-size: max(13px, calc(15.5 * var(--u)));
      }
      .pl.bar .k {
        padding: calc(5 * var(--u)) calc(8 * var(--u));
      }
      .pl.bar .cnt {
        font-size: max(15px, calc(19 * var(--u)));
      }
      .pl .k {
        display: inline-block;
        padding: calc(7 * var(--u)) calc(12 * var(--u));
        border-radius: calc(9 * var(--u));
        background: rgba(18, 18, 17, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition:
          background 0.3s,
          border-color 0.3s,
          color 0.3s;
      }
      .pl.cur .k {
        background: var(--or);
        border-color: var(--or);
        color: #111;
        animation: plPop 0.42s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      @keyframes plPop {
        0% {
          transform: scale(0.86);
        }
        100% {
          transform: scale(1);
        }
      }
      #svg {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        width: 100vw;
        height: 100vh;
        overflow: visible;
      }
      #svg .ln {
        fill: none;
        stroke: rgba(250, 250, 246, 0.85);
        stroke-width: 1.4;
        transition: opacity 0.4s;
      }
      #svg .lo {
        fill: none;
        stroke: rgba(10, 10, 10, 0.38);
        stroke-width: 3.4;
        stroke-linecap: round;
      }
      #svg .ln.cur {
        stroke: var(--or);
        stroke-width: 1.8;
      }
      #svg .dt {
        fill: #fafaf6;
        stroke: rgba(10, 10, 10, 0.45);
        stroke-width: 1.2;
      }
      #svg .dt.cur {
        fill: var(--or);
      }

      /* ---------- focus layout ---------- */
      /* --mt — основной текст фокуса: не меньше 28 px при любом окне */
      #fx {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        color: #f2f2ee;
        --mt: max(28px, calc(28 * var(--u)));
      }
      #fx .pane {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 0.5s ease;
        --pw: min(calc(868 * var(--u) + (28px - 28 * var(--u)) * 16), 58vw);
        --lw: calc(100vw - var(--pw) - 192 * var(--u));
      }
      #fx .pane.wide {
        --pw: min(calc(910 * var(--u) + (28px - 28 * var(--u)) * 16), 60vw);
      }
      #fx .pane.on {
        opacity: 1;
      }
      #fx .pane.on .fx-pts,
      #fx .pane.on .fx-stats,
      #fx .pane.on .fx-head,
      #fx .pane.on .notes {
        pointer-events: auto;
      }
      .fx-scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(14, 14, 13, 0.16) 0%,
          rgba(14, 14, 13, 0) 18%,
          rgba(14, 14, 13, 0) 80%,
          rgba(14, 14, 13, 0.16) 100%
        );
      }
      .fx-head {
        position: absolute;
        left: calc(84 * var(--u));
        top: calc(58 * var(--u));
        width: min(calc(860 * var(--u)), var(--lw));
        isolation: isolate;
      }
      /* мягкая тёмная «лужа» под заголовком: белый текст читается на серой студии (контраст > 9:1) */
      .fx-head:before {
        content: "";
        position: absolute;
        z-index: -1;
        left: calc(-70 * var(--u));
        top: calc(-50 * var(--u));
        right: calc(-40 * var(--u));
        bottom: calc(-40 * var(--u));
        border-radius: calc(80 * var(--u));
        background: rgba(15, 15, 14, 0.66);
        filter: blur(calc(46 * var(--u)));
      }
      .fx-meta {
        display: flex;
        align-items: center;
        gap: calc(14 * var(--u));
        font: 500 max(13px, calc(15 * var(--u)))/1 var(--fM);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #c9c9c3;
      }
      .fx-meta i {
        width: calc(9 * var(--u));
        height: calc(9 * var(--u));
        border-radius: 2px;
        background: var(--or);
      }
      .fx-meta b {
        color: #f4f4f0;
        font-weight: 600;
      }
      .fx-title {
        font: 650 calc(70 * var(--u))/1 var(--fT);
        letter-spacing: -0.032em;
        margin: calc(20 * var(--u)) 0 calc(18 * var(--u));
        color: #fafaf7;
        text-shadow: 0 2px 28px rgba(0, 0, 0, 0.35);
      }
      .fx-thesis {
        margin: 0;
        font: 500 max(28px, calc(33 * var(--u)))/1.24 var(--fT);
        letter-spacing: -0.012em;
        color: #f0f0eb;
        max-width: calc(820 * var(--u));
        text-wrap: pretty;
        text-shadow:
          0 1px 22px rgba(0, 0, 0, 0.45),
          0 0 2px rgba(0, 0, 0, 0.3);
      }
      .fx-thesis code {
        font-size: 0.86em;
        color: #fff;
      }
      /* на окнах меньше 1920×1080 панель шире пропорции: текст держит 28 px, и строк меньше */
      .fx-pts {
        position: absolute;
        right: calc(62 * var(--u));
        width: var(--pw);
        top: 50%;
        transform: translateY(-50%);
        max-height: calc(100vh - max(110px, calc(150 * var(--u))));
        display: flex;
        flex-direction: column;
        padding: calc(28 * var(--u)) calc(40 * var(--u)) calc(28 * var(--u))
          calc(34 * var(--u));
        border-radius: calc(28 * var(--u));
        background: rgba(18, 18, 17, 0.87);
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(26px) saturate(1.1);
        -webkit-backdrop-filter: blur(26px) saturate(1.1);
      }

      .pts-vp {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        margin-left: calc(-20 * var(--u));
        padding-left: calc(20 * var(--u));
      }
      .pts-vp.ovf {
        -webkit-mask-image: linear-gradient(
          180deg,
          transparent 0,
          #000 calc(30 * var(--u)),
          #000 calc(100% - 30 * var(--u)),
          transparent
        );
        mask-image: linear-gradient(
          180deg,
          transparent 0,
          #000 calc(30 * var(--u)),
          #000 calc(100% - 30 * var(--u)),
          transparent
        );
      }
      .pts-in {
        transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .pt {
        position: relative;
        display: grid;
        grid-template-columns: max(40px, calc(54 * var(--u))) 1fr;
        padding: calc(9 * var(--u)) 0 calc(9 * var(--u));
        font: 400 var(--mt)/1.3 var(--fB);
        color: #f1f1ec;
        transition:
          opacity 0.45s ease,
          color 0.45s ease;
      }
      .pt + .pt {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .pt-i {
        font: 500 max(13px, calc(15 * var(--u)))/calc(var(--mt) * 1.3) var(--fM);
        color: #a9a9a2;
        letter-spacing: 0.04em;
        transition: color 0.3s;
      }
      .pt-t {
        text-wrap: pretty;
      }
      .pt-t b {
        font-weight: 600;
        color: #fff;
      }
      .pt-t code {
        font-size: 0.84em;
        color: #fff;
        background: rgba(255, 255, 255, 0.09);
        padding: 0.05em 0.3em;
        border-radius: 0.25em;
      }
      .pt-t .here {
        display: inline-block;
        font: 600 0.62em/1 var(--fM);
        letter-spacing: 0.06em;

      // загрузочный экран: точки циферблата загораются по стадиям загрузки
      window.__ld = function (n) {
        const d = document.querySelectorAll(".ld-dial i");
        d.forEach((e, i) => e.classList.toggle("on", i < n));
      };
      window.__ld(1);
      window.addEventListener("unhandledrejection", function (e) {
        const el = document.getElementById("lderr");
        if (
          el &&
          !(
            document.getElementById("gl") &&
            document.getElementById("gl").classList.contains("on")
          )
        ) {
          el.style.display = "block";
          el.textContent =
            "Ошибка запуска сцены: " +
            ((e.reason && e.reason.message) || e.reason);
        }
        console.error(e.reason);
      });
      window.addEventListener("error", function (e) {
        const el = document.getElementById("lderr");
        if (el && !document.getElementById("gl")) {
          el.style.display = "block";
          el.textContent =
            "Не удалось загрузить сцену: " + (e.message || "ошибка сети");
        }
      });
      if (document.fonts)
        document.fonts
          .load('500 11px "JetBrains Mono"', "Студия")
          .then(() => document.documentElement.classList.add("fonts"));

      const clamp01 = (x) => clamp(x, 0, 1);
      const lerp = (a, b, t) => a + (b - a) * t;
      const smoother = (t) => t * t * t * (t * (t * 6 - 15) + 10);
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);
      const easeInOut = (t) =>
        t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const smoothstepJS = (a, b, x) => {
        const t = clamp01((x - a) / (b - a));
        return t * t * (3 - 2 * t);
      };
      const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
      const lerpAng = (a, b, t) => {
        let d =
          ((((b - a + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) %
            (2 * Math.PI)) -
          Math.PI;
        return a + d * t;
      };

      class Spring {
        constructor(x = 0, k = 170, c = 18) {
          this.x = x;
          this.t = x;
          this.v = 0;
          this.k = k;
          this.c = c;
        }
        step(dt) {
          const n = Math.max(1, Math.ceil(dt * 240));
          const h = dt / n;
          for (let i = 0; i < n; i++) {
            this.v += (this.k * (this.t - this.x) - this.c * this.v) * h;
            this.x += this.v * h;
          }
          return this.x;
        }
        snap(x) {
          this.x = this.t = x;
          this.v = 0;
          return this;
        }
        get rest() {
          return Math.abs(this.x - this.t) < 1e-4 && Math.abs(this.v) < 1e-3;
        }
      }
      // падение на стол с неупругим отскоком (интро: предметы «ставятся» на стол)
      class Drop {
        constructor() {
          this.x = 0;
          this.v = 0;
          this.t = 0;
        }
        snap(x) {
          this.x = x;
          this.v = 0;
          this.t = x;
          return this;
        }
        step(dt) {
          if (this.t > 0) {
            this.x = this.t;
            return this.x;
          }
          if (this.x <= 0 && this.v === 0) return 0;
          const n = Math.max(1, Math.ceil(dt * 240)),
            h = dt / n;
          for (let i = 0; i < n; i++) {
            this.v -= 42 * h;
            this.x += this.v * h;
            if (this.x < 0) {
              this.x = 0;
              this.v = -this.v * 0.26;
              if (this.v < 0.45) this.v = 0;
            }
          }
          return this.x;
        }
      }

      /* ---------- design grid (px @1920×1080 overview) → world ---------- */
      // Макет полотна в «дизайн-пикселях» 1920×1080; обзорная камера смотрит на него наклонно и с перспективой.
      // PITCH — наклон обзорной камеры над столом (46° от горизонта), FOV — её угол зрения.
      const DES = {
        PX: 66.6,
        PITCH: 46 * D2R,
        FOV: 13,
        FOV_F: 16,
        YAW: -1.5 * D2R,
      };
      // подиумы крупнее ячеек текста: отступ текста от кромки — PAD_X / PAD_B дизайн-пикселей (≥ 24 на любом масштабе)
      // у кромки подиума отступ больше (PAD_E): в перспективе кромка наклонена, а колонка текста вертикальна
      const ROWS = [30, 397, 744],
        ROW_HS = [345, 325, 325],
        PAD_X = 32,
        PAD_L = 52,
        PAD_E = 58,
        PAD_B = 37;
      const CELLS = {
        hero: { r: 0, x: 30, w: 590 },
        1: { r: 0, x: 640, w: 290 },
        2: { r: 0, x: 930, w: 315 },
        3: { r: 0, x: 1245, w: 300 },
        4: { r: 0, x: 1545, w: 345, padR: 70 },
        5: { r: 1, x: 30, w: 330 },
        6: { r: 1, x: 360, w: 330 },
        7: { r: 1, x: 690, w: 330 },
        8: { r: 1, x: 1040, w: 445 },
        9: { r: 1, x: 1485, w: 405 },
        10: { r: 2, x: 30, w: 306 },
        11: { r: 2, x: 336, w: 1068 },
        g: { r: 2, x: 1424, w: 466 },
      };
      // подиумы групп разной высоты — кейсы с ложементами под предметы; между подиумами — тени
      const MATS = [
        {
          g: "process",
          x: 640,
          y: 30,
          w: 1250,
          h: 345,
          range: "01–04",
          ht: 0.5,
        },
        { g: "base", x: 30, y: 397, w: 990, h: 325, range: "05–07", ht: 0.26 },
        { g: "team", x: 1040, y: 397, w: 850, h: 325, range: "08–09", ht: 0.4 },
        {
          g: "practice",
          x: 30,
          y: 744,

        },
        { g: "main", x: 1424, y: 744, w: 466, h: 325, range: "", ht: 0.62 },
      ];
      const GROUP_OF_MAT = {
        1: "process",
        2: "process",
        3: "process",
        4: "process",
        5: "base",
        6: "base",
        7: "base",

      const matH = (id) =>
        (MATS.find((m) => m.g === GROUP_OF_MAT[id]) || { ht: 0 }).ht;
      const ORDER = [
        "1",

        "3",
        "4",
        "5",
        "6",
        "7",
        "8",
        "9",
        "10",

        "g",
      ];
      const wx = (x) => (x - 960) / DES.PX;
      const wz = (y) => (y - 540) / (DES.PX * Math.sin(DES.PITCH));
      const W3 = (x, y, h = 0) => new THREE.Vector3(wx(x), h, wz(y));

      /* ---------- renderer ---------- */
      const renderer = new THREE.WebGPURenderer({
        antialias: false,
        forceWebGL: FORCE_WEBGL,
        powerPreference: "high-performance",
      });
      // DPR сцены — до 2 (Retina MacBook — 3456×2234); дальше адаптируется по бюджету кадра в обе стороны
      const DPR_MAX = Math.min(window.devicePixelRatio || 1, 2);
      let DPR = Q.has("dpr")
        ? clamp(parseFloat(Q.get("dpr")) || 1, 0.5, 2)
        : DPR_MAX;
      renderer.setPixelRatio(DPR);
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.VSMShadowMap;
      renderer.domElement.id = "gl";
      document.body.prepend(renderer.domElement);
      await renderer.init();
      window.__ld && window.__ld(2);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        DES.FOV,

      /* ---------- studio environment (procedural softboxes → PMREM) ---------- */
      function studioEnv() {
        const s = new THREE.Scene();
        const bm = (c, k = 1) =>
          new THREE.MeshBasicMaterial({
            color: new THREE.Color(c).multiplyScalar(k),
            side: THREE.DoubleSide,
          });
        // комната: светлее у потолка, темнее у пола — мягкий градиент для отражений металла
        const room = new THREE.Mesh(
          new THREE.SphereGeometry(45, 48, 24),
          new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide }),
        );
        room.material.colorNode = mix(
          vec3(0.16, 0.16, 0.155),
          vec3(0.45, 0.45, 0.44),
          smoothstep(-0.2, 0.9, positionWorld.y.div(45)),
        );
        s.add(room);
        const fl = new THREE.Mesh(
          new THREE.CircleGeometry(44, 48),
          bm(0xb4b4b0, 1.15),
        );
        fl.rotation.x = -Math.PI / 2;
        fl.position.y = -3;
        s.add(fl);
        // софтбокс — скруглённый прямоугольник: ровная заливка, мягкая кромка, чуть «горячий» центр.
        // В отражениях металла и глянца читается как настоящий студийный софтбокс, а не размытое пятно.
        const card = (w, h, c, k, x, y, z) => {
          const mat = new THREE.MeshBasicNodeMaterial({
            side: THREE.DoubleSide,
          });
          const col = new THREE.Color(c).multiplyScalar(k * 0.74);
          const sm = Math.min(w, h),
            soft = sm * 0.13,
            rad = sm * 0.26;
          mat.colorNode = Fn(() => {
            const q = uv().sub(0.5).abs().mul(vec2(w, h)),
              hs = vec2(w / 2 - soft - rad, h / 2 - soft - rad);
            const dd = q.sub(hs),
              d = length(max(dd, vec2(0)))
                .add(min(max(dd.x, dd.y), 0))
                .sub(rad);
            const hot = float(1.12).sub(length(uv().sub(0.5).mul(2)).mul(0.16));
            return vec3(col.r, col.g, col.b)
              .mul(float(1).sub(smoothstep(-soft, soft, d)))
              .mul(hot);
          })();
          const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
          m.position.set(x, y, z);
          m.lookAt(0, 0, 0);
          s.add(m);
        };
        card(16, 10, 0xffffff, 2.6, 0, 24, 0); // overhead softbox
        card(26, 9, 0xffffff, 2.2, 0, 18, -15); // back-top: блик на верхних гранях в обзоре
        card(3, 20, 0xffffff, 5.0, -21, 9, 2); // left strip
        card(3, 20, 0xfff4ea, 2.8, 21, 9, -2); // right strip
        card(24, 5, 0xffffff, 1.2, 0, 7, -24); // back strip
        card(16, 7, 0xfff0e2, 1.1, 6, 8, 22); // warm front fill
        card(6, 6, 0xffffff, 5.5, -11, 17, 12); // key reflection
        // тонкие световые полосы: линейный блик вдоль фасок (длинная — сзади сверху, вертикальная — справа)
        card(36, 0.5, 0xffffff, 9, 0, 12.5, -20);
        card(0.42, 15, 0xfff6ee, 8, 20, 11, 9);
        return s;
      }
      const pmrem = new THREE.PMREMGenerator(renderer);
      const STUDIO = pmrem.fromScene(studioEnv(), 0.03, 0.1, 120).texture;
      scene.environment = STUDIO;
      scene.environmentIntensity = 1;

      /* ---------- colors / lights ---------- */
      // обзор и фокус — одна и та же нейтрально-серая студия; в фокусе она лишь немного приглушается
      const BG_LIGHT = new THREE.Color(0x8b8b88),
        BG_DARK = new THREE.Color(0x767673);
      scene.background = BG_LIGHT.clone();
      scene.fog = new THREE.Fog(BG_LIGHT.clone(), 90, 260);

      const key = new THREE.DirectionalLight(0xfffaf4, 2.2);
      const KEY_DIR = new THREE.Vector3(-0.62, 1, -0.5).normalize();
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.radius = 7;
      key.shadow.blurSamples = 14;
      key.shadow.bias = -0.0006;
      key.shadow.normalBias = 0.015;
      key.shadow.camera.near = 1;
      key.shadow.camera.far = 90;
      scene.add(key, key.target);

      // прожектор фокуса: карта 2048, тесный фрустум под предмет (near/far и focus пересчитываются в stepLight),
      // радиус размытия VSM согласован с числом выборок — непрерывная мягкая полутень без «зубцов»
      const spot = new THREE.SpotLight(0xfff3e8, 0, 0, 0.2, 0.95, 0);
      spot.castShadow = true;
      spot.shadow.mapSize.set(2048, 2048);
      spot.shadow.radius = 5;
      spot.shadow.blurSamples = 14;
      spot.shadow.bias = -0.0002;
      spot.shadow.normalBias = 0.004;
      spot.shadow.camera.near = 8;
      spot.shadow.camera.far = 28;
      spot.shadow.focus = 0.9;
      scene.add(spot, spot.target);

      // рисунок окна: ProjectorLight с процедурной размытой маской рамы медленно плывёт по столу (только в обзоре, слабый)
      const uWinSoft = uniform(0.035);
      const winLight = new THREE.ProjectorLight(0xfff1df, 0, 0, 0.46, 0.55, 0);
      winLight.colorNode = Fn(([p]) => {
        // 3×2 стекла, импосты с мягкой кромкой (как тень рамы сквозь рассеиватель), лёгкий спад к краю проекции
        const g = fract(p.mul(vec2(3, 2)))
          .sub(0.5)
          .abs()
          .mul(2);
        const pane = float(1)
          .sub(smoothstep(0.8, uWinSoft.mul(9).add(0.8), g.x))
          .mul(float(1).sub(smoothstep(0.76, uWinSoft.mul(9).add(0.76), g.y)));
        const edge = float(1).sub(
          smoothstep(0.36, 0.5, max(abs(p.x.sub(0.5)), abs(p.y.sub(0.5)))),
        );
        return vec3(pane.mul(edge));
      });
      winLight.castShadow = false;
      scene.add(winLight, winLight.target);

      const rim = new THREE.DirectionalLight(0xffffff, 0); // контровой свет в фокусе
      const fill = new THREE.DirectionalLight(0xfff6ee, 0); // мягкий фронтальный заполняющий свет в фокусе
      scene.add(fill, fill.target);
      rim.position.set(6, 9, -12);
      scene.add(rim);

      /* ---------- contact shadows (top-down max-height pass + blur) ---------- */
      const CS = { cx: 0, cz: 0, w: 34, d: 24, H: 1.25, rw: 1024, rh: 724 };
      const csRT = [0, 1].map(
        () =>
          new THREE.RenderTarget(CS.rw, CS.rh, {
            type: THREE.HalfFloatType,
            depthBuffer: false,
          }),
      );
      const csCam = new THREE.OrthographicCamera(
        -CS.w / 2,
        CS.w / 2,
        CS.d / 2,
        -CS.d / 2,
        0.1,
        80,
      );
      csCam.position.set(CS.cx, 40, CS.cz);
      csCam.up.set(0, 0, -1);
      csCam.lookAt(CS.cx, 0, CS.cz);
      csCam.layers.set(1);
      // прямоугольники подиумов в мировых координатах
      const PODS = MATS.map((m) => {
        const x0 = wx(m.x),
          x1 = wx(m.x + m.w),
          z0 = wz(m.y),
          z1 = wz(m.y + m.h);
        return {
          x0,
          x1,
          z0,
          z1,
          cx: (x0 + x1) / 2,
          cz: (z0 + z1) / 2,
          hx: (x1 - x0) / 2,
          hz: (z1 - z0) / 2,
          h: m.ht,
        };
      });
      // высота опорной поверхности под точкой (пол или верх подиума) — контактная тень считается от неё
      const baseAt = (p) => {
        let b = float(0);
        for (const q of PODS) {
          const ins = step(q.x0, p.x)
            .mul(step(p.x, q.x1))
            .mul(step(q.z0, p.z))
            .mul(step(p.z, q.z1));
          b = max(b, ins.mul(q.h));
        }
        return b;
      };
      // мягкое «AO» пола у основания подиумов (аналитически, по SDF скруглённого прямоугольника)
      const podAO = (p) => {
        let a = float(0);
        for (const q of PODS) {
          const d = vec2(
            abs(p.x.sub(q.cx)).sub(q.hx - 0.4),
            abs(p.z.sub(q.cz)).sub(q.hz - 0.4),
          );
          const sd = length(max(d, vec2(0)))
            .add(min(max(d.x, d.y), 0))
            .sub(0.4);
          a = max(
            a,
            float(1)
              .sub(smoothstep(0, 0.35 + q.h * 2.2, sd))
              .mul(0.22 + q.h * 0.55),
          );
        }
        return a;
      };
      const csMat = new THREE.MeshBasicNodeMaterial({ side: THREE.DoubleSide });
      csMat.colorNode = vec4(
        vec3(
          float(1)
            .sub(
              smoothstep(0, CS.H, positionWorld.y.sub(baseAt(positionWorld))),
            )
            .pow(1.8),
        ),
        1,
      );
      Object.assign(csMat, {
        blending: THREE.CustomBlending,
        blendEquation: THREE.MaxEquation,
        blendSrc: THREE.OneFactor,
        blendDst: THREE.OneFactor,
        depthTest: false,
        depthWrite: false,
      });
      const csBlur = [0, 1].map((i) => {
        const src = csRT[i],
          dir = i === 0 ? [1, 0] : [0, 1];
        const m = new THREE.NodeMaterial();
        const W = [0.2042, 0.1802, 0.1238, 0.0663, 0.0276, 0.009];
        m.fragmentNode = Fn(() => {
          const px = vec2(dir[0] / CS.rw, dir[1] / CS.rh).mul(2.4);
          const s = texture(src.texture, uv()).r.mul(W[0]).toVar();
          for (let k = 1; k < 6; k++) {
            s.addAssign(texture(src.texture, uv().add(px.mul(k))).r.mul(W[k]));
            s.addAssign(texture(src.texture, uv().sub(px.mul(k))).r.mul(W[k]));
          }
          return vec4(vec3(s), 1);
        })();
        return new THREE.QuadMesh(m);
      });
      const csTex = texture(csRT[0].texture);
      const uCS = uniform(0.8);
      const csAt = (p) =>
        csTex.sample(
          vec2(
            p.x.sub(CS.cx).div(CS.w).add(0.5),
            p.z.sub(CS.cz).div(CS.d).add(0.5),
          ),
        ).r;
      function renderContactShadows() {
        const bg = scene.background,
          fg = scene.fog;
        scene.background = null;
        scene.fog = null;
        scene.overrideMaterial = csMat;
        renderer.setRenderTarget(csRT[0]);
        renderer.setClearColor(0x000000, 1);
        renderer.clear();
        renderer.render(scene, csCam);
        scene.overrideMaterial = null;
        scene.background = bg;
        scene.fog = fg;
        for (let it = 0; it < 2; it++) {
          renderer.setRenderTarget(csRT[1]);
          csBlur[0].render(renderer);
          renderer.setRenderTarget(csRT[0]);
          csBlur[1].render(renderer);
        }
        renderer.setRenderTarget(null);
      }

      /* ---------- шум: тайлящаяся текстура value-noise, сглаженная мипмапами ----------
   Дешевле процедурного шума в каждом пикселе (а на 7,7 Мпикс это заметно) и сама гасит мелкий шум вдали.
   Каналы — независимые решётки: R 16, G 32, B 8, A 64 ячейки на тайл. */
      const NOISE_TEX = (() => {
        const N = 256,
          d = new Uint8Array(N * N * 4),
          CS = [16, 32, 8, 64];
        let sd = 11;
        const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
        const lat = CS.map((c) => Float32Array.from({ length: c * c }, r)),
          q = (t) => t * t * t * (t * (t * 6 - 15) + 10);
        for (let ch = 0; ch < 4; ch++) {
          const c = CS[ch],
            L = lat[ch];
          for (let y = 0; y < N; y++)
            for (let x = 0; x < N; x++) {
              const u = (x / N) * c,
                v = (y / N) * c,
                i = Math.floor(u),
                j = Math.floor(v),
                fu = q(u - i),
                fv = q(v - j),
                A = (a, b) => L[(a % c) + (b % c) * c];
              d[(y * N + x) * 4 + ch] = Math.round(
                255 *
                  ((A(i, j) * (1 - fu) + A(i + 1, j) * fu) * (1 - fv) +
                    (A(i, j + 1) * (1 - fu) + A(i + 1, j + 1) * fu) * fv),
              );
            }
        }
        const t = new THREE.DataTexture(d, N, N, THREE.RGBAFormat);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.magFilter = THREE.LinearFilter;
        t.minFilter = THREE.LinearMipmapLinearFilter;
        t.generateMipmaps = true;
        t.anisotropy = 4;
        t.needsUpdate = true;
        return t;
      })();
      // nz2 — шум по плоскости (−1…1), частота f ≈ «ячеек на единицу»; nz — то же для 3D-точки (косая проекция на плоскость)
      const nz2 = (p, f) =>
        texture(NOISE_TEX, p.mul(f / 16))
          .r.mul(2)
          .sub(1);
      const nz = (p, f) =>
        nz2(vec2(p.x.add(p.y.mul(0.61)), p.z.sub(p.y.mul(0.37))), f);

      /* ---------- floor (seamless studio sweep) ---------- */
      // пол темнее и теплее подиумов: пятно света в центре композиции и спад к краям — подиумы выходят вперёд
      const FLOOR_L = new THREE.Color(0x86817a),
        FLOOR_D = new THREE.Color(0x7e7a73),
        MAT_L = new THREE.Color(0xcfcfcb),
        MAT_D = new THREE.Color(0xabaaa5);
      const SIDE_C = new THREE.Color(0x3b3a37); // боковая кромка подиума: тёплая тёмно-серая порошковая краска
      // медленно плывущее «облако» света по столу (как свет из окна студии сквозь рассеиватель)
      const uCloud = uniform(1);
      const cloud = (p) =>
        nz2(p.xz.mul(0.07).add(vec2(time.mul(0.018), time.mul(0.011))), 1)
          .mul(0.06)
          .mul(uCloud);
      const uFloor = uniform(FLOOR_L.clone());
      const uMat = uniform(MAT_L.clone());
      const floorMat = new THREE.MeshStandardNodeMaterial({
        roughness: 0.94,
        metalness: 0,
      });
      floorMat.colorNode = Fn(() => {
        const p = positionWorld;
        const r = length(p.xz.add(vec2(1, -0.5)).div(vec2(21, 14)));
        const fall = mix(float(1.13), float(0.56), smoothstep(0.15, 1.6, r));
        const n = nz2(p.xz, 0.9)
          .mul(0.022)
          .add(nz2(p.xz, 19).mul(0.012))
          .add(cloud(p));
        return uFloor
          .mul(fall.add(n))
          .mul(float(1).sub(max(csAt(p).mul(uCS), podAO(p))));
      })();
      floorMat.roughnessNode = float(0.9).add(
        nz2(positionWorld.xz, 3.1).mul(0.06),
      );
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);
      // подиум-кейс: светлая столешница с ложементами под предметы, светлая фаска (тонкая линия блика),
      // боковая кромка из другого материала — тёмная порошковая краска. Узлы собираются после расстановки предметов.
      function podiumMaterial(pockets) {
        const matMat = new THREE.MeshStandardNodeMaterial({
          roughness: 0.78,
          metalness: 0,
        });
        const sdRR = (q, hx, hz, r) => {
          const d = abs(q).sub(vec2(hx - r, hz - r));
          return length(max(d, vec2(0)))
            .add(min(max(d.x, d.y), 0))
            .sub(r);
        };
        const pocketShade = (p) => {
          let dark = float(0),
            rim = float(0);
          for (const k of pockets) {
            const sd = sdRR(p.xz.sub(vec2(k.cx, k.cz)), k.hx, k.hz, k.r);
            const inside = float(1).sub(smoothstep(-0.012, 0.004, sd));
            const groove = float(1).sub(
              smoothstep(0.004, 0.02, abs(sd.add(0.008))),
            );
            dark = dark
              .add(groove.mul(0.3))
              .add(inside.mul(exp(min(sd, 0).div(0.11))).mul(0.2))
              .add(inside.mul(0.035));
            rim = rim.add(
              smoothstep(0.006, 0.016, sd).mul(
                float(1).sub(smoothstep(0.016, 0.05, sd)),
              ),
            );
          }
          return vec2(dark, rim);
        };
        const ny = normalWorld.y,
          top = smoothstep(0.95, 0.995, ny),
          side = float(1).sub(smoothstep(0.18, 0.42, ny)),
          bev = float(1).sub(top).sub(side).max(0);
        matMat.colorNode = Fn(() => {
          const p = positionWorld;
          const r = length(p.xz.add(vec2(1, -0.5)).div(vec2(24, 17)));
          const n = nz2(p.xz, 1.7)
            .mul(0.018)
            .add(nz2(p.xz, 23).mul(0.012))
            .add(cloud(p));
          const pk = pocketShade(p).mul(top);
          const topC = uMat
            .mul(mix(float(1.04), float(0.86), smoothstep(0.15, 1.5, r)).add(n))
            .mul(float(1).sub(pk.x).add(pk.y.mul(0.05)))
            .mul(float(1).add(bev.mul(0.07)));
          const sideC = vec3(SIDE_C.r, SIDE_C.g, SIDE_C.b).mul(
            float(1).add(nz(p, 40).mul(0.05)),
          );
          return mix(topC, sideC, side).mul(
            float(1).sub(csAt(p).mul(uCS).mul(float(1).sub(side))),
          );
        })();
        matMat.roughnessNode = mix(
          mix(
            float(0.8).add(nz2(positionWorld.xz, 4.3).mul(0.05)),
            float(0.3),
            bev,
          ),
          float(0.52).add(nz(positionWorld, 55).mul(0.08)),
          side,
        );
        return matMat;
      }

      /* ---------- reflections: CubeCamera из центра предмета в фокусе, смешивается со студией ---------- */
      // снимается при посадке камеры и при заметной смене состояния предмета; фон снимка — сама студия,
      // поэтому софтбоксы в отражениях остаются, а к ним добавляются стол, подиум и соседи
      const cubeRT = new THREE.CubeRenderTarget(256, {
        type: THREE.HalfFloatType,
      });
      const cubeCam = new THREE.CubeCamera(0.04, 90, cubeRT);
      const uCube = uniform(0);
      scene.environmentNode = mix(
        pmremTexture(STUDIO),
        pmremTexture(cubeRT.texture),
        uCube,
      );

      /* ---------- post: MSAA + MRT → GTAO → SSR (фокус) → DOF → bloom по эмиссии → тонмаппинг, сплит-тон, виньетка, зерно ---------- */
      // ?fx=-ao,-ssr — отключить эффекты (деградация и отладка); ?msaa=0 — без MSAA
      const FX = {
        ao: true,
        ssr: !FORCE_WEBGL,
        bloom: true,
        cube: true,
        gobo: true,
        sweep: true,
      };
      for (const k of (Q.get("fx") || "").split(","))
        if (k.startsWith("-")) FX[k.slice(1)] = false;
      const EMS = 0.25; // эмиссия пишется в MRT ×0,25: 8 бит на канал без пересвета; сила bloom это компенсирует
      const pipe = new THREE.RenderPipeline(renderer);
      pipe.outputColorTransform = false;
      const scenePass = pass(scene, camera, {
        samples: Q.has("msaa") ? +Q.get("msaa") : 4,
      });
      const sceneMRT = mrt({
        output,
        normal: packNormalToRGB(normalView),
        emissive: vec4(emissive.mul(EMS), output.a),
        metalrough: vec2(metalness, roughness),
      });
      sceneMRT.setBlendMode(
        "emissive",
        new THREE.BlendMode(THREE.NormalBlending),
      );
      scenePass.setMRT(sceneMRT);
      for (const n of ["normal", "emissive", "metalrough"])
        scenePass.getTexture(n).type = THREE.UnsignedByteType;
      const sColor = scenePass.getTextureNode("output"),
        sDepth = scenePass.getTextureNode("depth"),
        sNormalT = scenePass.getTextureNode("normal"),
        sMR = scenePass.getTextureNode("metalrough");
      const sNormal = sample((u) => unpackRGBToNormal(sNormalT.sample(u)));
      // GTAO, денойз и SSR читают глубину через textureGather — мультисэмпловую глубину сводим в обычную float-текстуру
      const sDepthR = rtt(sDepth, null, null, {
        type: THREE.FloatType,
        format: THREE.RedFormat,
        depthBuffer: false,
        resolutionScale: 0.5,
      });
      const uFocus = uniform(80),
        uRange = uniform(60),
        uBokeh = uniform(0);
      const uVig = uniform(0.18),
        uGrain = uniform(0.03),
        uFrame = uniform(0);
      const uAO = uniform(1),
        uSSR = uniform(0),
        uBloom = uniform(1),
        uGrade = uniform(1);
      // GTAO: щели между кейкапами, прорези фейдеров, зазоры слоёв; радиус — в масштабе деталей, половинное разрешение + денойз
      let aoNode = null,
        aoTerm = float(1);
      if (FX.ao) {
        aoNode = ao(sDepthR, sNormal, camera);
        aoNode.resolutionScale = 0.5;
        aoNode.samples.value = 8;
        aoNode.radius.value = 0.2;
        aoNode.thickness.value = 0.5;
        aoNode.distanceExponent.value = 1.4;
        aoNode.distanceFallOff.value = 0.8;
        aoNode.scale.value = 1.1;
        // денойз — тоже в половинном разрешении (отдельный RTT), в композит AO приходит билинейной выборкой
        const aoDn = denoise(aoNode.getTextureNode(), sDepthR, sNormal, camera);
        aoDn.radius.value = 4;
        const aoD = rtt(aoDn, null, null, {
          resolutionScale: 0.5,
          type: THREE.HalfFloatType,
          depthBuffer: false,
        });
        aoTerm = mix(float(1), aoD.sample(screenUV).r, uAO);
      }
      // SSR в фокусе: металл и глянцевый пластик отражают соседние детали; в обзоре проход не рендерится вовсе.
      // В режиме blur вес отражения = metalness, поэтому глянцевому пластику (шероховатость < 0,45) даём «вес» 0,12,
      // а шершавые поверхности (пол, подиумы, бумага) отбрасываются до трассировки — отражения пластика есть, лишней работы нет
      let ssrNode = null,
        ssrTerm = vec3(0);
      if (FX.ssr) {
        const ssrW = max(
          sMR.r,
          float(1)
            .sub(smoothstep(0.22, 0.45, sMR.g))
            .mul(0.12),
        );
        ssrNode = ssr(sColor, sDepthR, sNormal, {
          metalnessNode: ssrW,
          roughnessNode: sMR.g,
          reflectNonMetals: false,
          camera,
        });
        ssrNode.resolutionScale = 0.5;
        ssrNode.quality.value = 0.45;
        ssrNode.maxDistance.value = 2.2;
        ssrNode.thickness.value = 0.06;
        ssrNode.intensity.value = 0.6;
        const ub = ssrNode.updateBefore;
        ssrNode.updateBefore = function (f) {
          if (uSSR.value > 0.002) return ub.call(this, f);
        };
        ssrTerm = ssrNode.rgb.mul(uSSR);
      }
      const litNode = Fn(() => sColor.rgb.mul(aoTerm).add(ssrTerm))();
      const dofNode = dof(
        litNode,
        scenePass.getViewZNode(),
        uFocus,
        uRange,
        uBokeh,
      );
      const bloomNode = FX.bloom
        ? bloom(scenePass.getTextureNode("emissive"), uniform(1.5), 0.62, 0)
        : null;
      const hash12 = Fn(([p]) => {
        const p3 = fract(vec3(p.x, p.y, p.x).mul(0.1031)).toVar();
        p3.addAssign(dot(p3, p3.yzx.add(33.33)));
        return fract(p3.x.add(p3.y).mul(p3.z));
      });
      pipe.outputNode = Fn(() => {
        const c = (
          bloomNode ? dofNode.rgb.add(bloomNode.rgb.mul(uBloom)) : dofNode.rgb
        ).toVar();
        const q = screenUV.sub(0.5).mul(vec2(1.0, 0.8));
        c.mulAssign(float(1).sub(dot(q, q).mul(uVig).mul(2.4)));
        const n = hash12(
          screenCoordinate.xy.add(vec2(uFrame.mul(37.0), uFrame.mul(11.0))),
        ).sub(0.5);
        c.addAssign(c.add(0.03).mul(n).mul(uGrain));
        // Neutral-тонмаппинг + sRGB, затем лёгкий сплит-тон: тёплые света, чуть холодные тени (одинаково в обзоре и фокусе)
        const d = renderOutput(vec4(c, 1)).rgb.toVar(),
          l = luminance(d);
        d.addAssign(
          vec3(0.03, 0.011, -0.022)
            .mul(smoothstep(0.42, 1, l))
            .mul(uGrade),
        );
        d.addAssign(
          vec3(-0.016, -0.002, 0.02)
            .mul(float(1).sub(smoothstep(0.02, 0.42, l)))
            .mul(uGrade),
        );
        return vec4(d, 1);
      })();

      /* ---------- materials ---------- */
      // Всё процедурно на TSL: неоднородная шероховатость (бисероструй, зерно пластика, разводы на глянце) и микрорельеф
      // с затуханием по дистанции — когда период шума подходит к размеру пикселя (fwidth), рельеф гаснет: без муара и мерцания.
      const phys = (p) => new THREE.MeshPhysicalNodeMaterial(p);
      const std = (p) => new THREE.MeshStandardNodeMaterial(p);
      const fadeF = (p, f) =>
        float(1).sub(smoothstep(0.28, 0.85, length(fwidth(p.mul(f)))));
      // высота → нормаль по экранным производным (bump без текстуры, Mikkelsen)
      const bumpNormal = (h) => {
        const p = positionView,
          n = normalView;
        const dpx = dFdx(p),
          dpy = dFdy(p);
        const r1 = cross(dpy, n),
          r2 = cross(n, dpx);
        const det = dot(dpx, r1);
        const g = sign(det).mul(r1.mul(dFdx(h)).add(r2.mul(dFdy(h))));
        return normalize(abs(det).mul(n).sub(g));
      };
      // o.rl — [амплитуда, частота] крупных разводов шероховатости, o.rf — мелкое зерно, o.b — [наклон, частота, растяжение xyz] рельефа
      function detail(m, o) {
        const p = o.geo ? positionGeometry : positionLocal;
        let r = float(m.roughness);
        if (o.rl) r = r.add(nz(p, o.rl[1]).mul(o.rl[0]));
        if (o.rf) r = r.add(nz(p, o.rf[1]).mul(o.rf[0]).mul(fadeF(p, o.rf[1])));
        m.roughnessNode = r.clamp(0.04, 1);
        if (o.b) {
          const [sl, f, sx = 1, sy = 1, sz = 1] = o.b;
          const q = p.mul(vec3(sx, sy, sz));
          m.normalNode = bumpNormal(
            nz(q, f)
              .mul(sl / f)
              .mul(fadeF(q, f)),
          );
        }
        return m;
      }
      const M = {
        alu: detail(phys({ color: 0xcfd0d2, metalness: 1, roughness: 0.3 }), {
          rl: [0.04, 3],
          rf: [0.035, 150],
          b: [0.035, 190],
        }),
        // бисероструйный алюминий: мелкая «пыль» шероховатости и рельефа
        aluBead: detail(
          phys({ color: 0xbdbec1, metalness: 1, roughness: 0.48 }),
          { rl: [0.03, 4], rf: [0.07, 230], b: [0.06, 260] },
        ),
        aluDark: detail(
          phys({ color: 0x3c3d40, metalness: 0.95, roughness: 0.38 }),
          { rl: [0.04, 3], rf: [0.05, 180], b: [0.04, 220] },
        ),
        // шлифованный алюминий: анизотропия вдоль u-развёртки — линейная на плитах (slab), круговая на телах вращения
        aluBrushed: detail(
          phys({
            color: 0xd3d4d6,
            metalness: 1,
            roughness: 0.32,
            anisotropy: 0.78,
          }),
          { rl: [0.035, 2.5], rf: [0.03, 120] },
        ),
        anoOrange: detail(
          phys({
            color: 0xe9592a,
            metalness: 0.92,
            roughness: 0.33,
            anisotropy: 0.72,
          }),
          { rl: [0.03, 3], rf: [0.03, 140] },
        ),
        anoDark: detail(
          phys({
            color: 0x2b2c30,
            metalness: 0.95,
            roughness: 0.3,
            anisotropy: 0.78,
          }),
          { rl: [0.03, 3], rf: [0.03, 140] },
        ),
        orange: detail(
          phys({
            color: 0xff5a1a,
            roughness: 0.38,
            clearcoat: 0.35,
            clearcoatRoughness: 0.28,
          }),
          { rl: [0.05, 4], rf: [0.04, 90], b: [0.045, 110] },
        ),
        orangeMatte: detail(phys({ color: 0xff5f20, roughness: 0.62 }), {
          rl: [0.05, 4],
          rf: [0.05, 90],
          b: [0.06, 120],
        }),
        white: detail(
          phys({
            color: 0xeceae5,
            roughness: 0.42,
            clearcoat: 0.18,
            clearcoatRoughness: 0.4,
          }),
          { rl: [0.05, 4], rf: [0.04, 90], b: [0.04, 110] },
        ),
        grey: detail(
          phys({ color: 0x9c9ea2, roughness: 0.5, clearcoat: 0.1 }),
          { rl: [0.05, 4], rf: [0.05, 90], b: [0.05, 110] },
        ),
        greyDark: detail(phys({ color: 0x5b5d61, roughness: 0.5 }), {
          rl: [0.05, 4],
          rf: [0.05, 90],
          b: [0.05, 110],
        }),
        dark: detail(
          phys({
            color: 0x232426,
            roughness: 0.48,
            clearcoat: 0.2,
            clearcoatRoughness: 0.35,
          }),
          { rl: [0.06, 4], rf: [0.05, 90], b: [0.05, 110] },
        ),
        // тёмный глянец: едва заметные разводы (крупный шум шероховатости), без рельефа
        darkGloss: detail(
          phys({
            color: 0x1d1e20,
            roughness: 0.22,
            clearcoat: 0.6,
            clearcoatRoughness: 0.16,
          }),
          { rl: [0.09, 2.2], rf: [0.02, 60] },
        ),
        black: detail(std({ color: 0x0e0e0f, roughness: 0.7 }), {
          rf: [0.06, 120],
          b: [0.05, 140],
        }),
        rubber: detail(std({ color: 0x18181a, roughness: 0.9 }), {
          rl: [0.04, 6],
          rf: [0.06, 160],
          b: [0.12, 170],
        }),
        // бумага: волокна — рельеф, растянутый вдоль листа
        paper: detail(std({ color: 0xf4f2ec, roughness: 0.94 }), {
          rf: [0.03, 80],
          b: [0.05, 90, 1, 6, 6],
        }),
        paperGrey: detail(std({ color: 0xe2e0d9, roughness: 0.94 }), {
          rf: [0.03, 80],
          b: [0.05, 90, 1, 6, 6],
        }),
        tick: std({ color: 0xd8d8d4, roughness: 0.5 }),
        glassDark: detail(
          phys({
            color: 0x2a2c2e,
            metalness: 0,
            roughness: 0.08,
            transmission: 0.0,
            clearcoat: 1,
            clearcoatRoughness: 0.05,
          }),
          { rl: [0.05, 2.5] },
        ),
      };
      // бумага со стопкой листов на торцах (торцы-строки); полосы листов гаснут, когда становятся мельче пикселя
      const padEdge = (yRel, base) =>
        Fn(() => {
          const side = float(1).sub(abs(normalLocal.y)).clamp(0, 1);
          const f = fract(yRel),
            w = fwidth(yRel),
            vis = float(1).sub(smoothstep(0.22, 0.5, w));
          const lines = smoothstep(0.5, w.max(0.04).add(0.5), f)
            .mul(float(1).sub(smoothstep(0.85, w.max(0.04).add(0.85), f)))
            .mul(0.13)
            .mul(side)
            .mul(vis);
          const fib = nz(positionLocal, 70).mul(0.012);
          return base.mul(float(1).sub(lines).add(fib).sub(side.mul(0.035)));
        })();
      M.pad = detail(std({ color: 0xf2f0ea, roughness: 0.95 }), {
        b: [0.05, 90, 1, 6, 6],
      });
      M.pad.colorNode = padEdge(
        positionLocal.y.mul(70),
        vec3(0.9, 0.885, 0.85),
      );
      // перфорированная решётка динамика: отверстия с фаской (светлая кромка сверху, тень внутри), рельеф по SDF отверстий
      M.grille = std({ color: 0x2a2b2d, roughness: 0.55, metalness: 0.35 });
      {
        const g = () => uv().mul(vec2(40, 24.5));
        const cellOf = (gg) =>
          fract(
            vec2(gg.x.add(step(1, fract(gg.y.mul(0.5)).mul(2)).mul(0.5)), gg.y),
          ).sub(0.5);
        M.grille.colorNode = Fn(() => {
          const c = cellOf(g()),
            d = length(c),
            hole = smoothstep(0.29, 0.25, d);
          const lip = smoothstep(0.36, 0.29, d)
            .mul(float(1).sub(hole))
            .mul(c.y.mul(-2.4).add(0.3).clamp(0, 1));
          return mix(
            vec3(0.05, 0.052, 0.056).add(lip.mul(0.11)),
            vec3(0.002),
            hole.mul(float(0.6).add(c.y.add(0.5).mul(0.4))),
          );
        })();
        M.grille.roughnessNode = Fn(() =>
          mix(
            float(0.5),
            float(0.9),
            smoothstep(0.29, 0.25, length(cellOf(g()))),
          ),
        )();
      }

      const ledMat = () =>
        std({
          color: 0x241913,
          roughness: 0.32,
          emissive: new THREE.Color(0xff5a1a),
          emissiveIntensity: 0,
        });
      // свет светодиода на соседней поверхности — мягкое пятно в плоскости этой поверхности (никаких спрайтов к камере)
      const glowTex = (() => {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const x = c.getContext("2d");
        const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, "rgba(255,255,255,1)");
        g.addColorStop(0.12, "rgba(255,255,255,.7)");
        g.addColorStop(0.35, "rgba(255,255,255,.22)");
        g.addColorStop(0.7, "rgba(255,255,255,.05)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        x.fillStyle = g;
        x.fillRect(0, 0, 256, 256);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      })();
      const FACE = {
        top: [-Math.PI / 2, 0, 0],
        front: [0, 0, 0],
        back: [0, Math.PI, 0],
        right: [0, Math.PI / 2, 0],
        left: [0, -Math.PI / 2, 0],
      };
      function glowSpot(parent, x, y, z, size, face = "top", color = 0xff6a26) {
        const m = new THREE.MeshBasicNodeMaterial({
          color,
          map: glowTex,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          opacity: 0,
          polygonOffset: true,
          polygonOffsetFactor: -2,
          polygonOffsetUnits: -2,
        });
        const s = mk(new THREE.PlaneGeometry(size, size), m, parent, x, y, z, {
          cs: false,
          cast: false,
          recv: false,
        });
        s.rotation.set(...FACE[face]);
        s.renderOrder = 3;
        s.visible = false;
        return s;
      }
      function canvasTex(w, h, draw) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        draw(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 16;
        return t;
      }
      // шелкография — служебные технические подписи (латиница, цифры, шкалы). Канвас 2048 px по длинной стороне,
      // мипмапы и анизотропия 16; рисуется после загрузки шрифтов (drawSilk в BOOT)
      const SILK = [];
      const INK_W = "#ecebe6",
        INK_D = "#2a2a2c",
        INK_O = "#ff5a1a";
      function silk(parent, w, d, draw, o = {}) {
        const W =
            w >= d ? 2048 : Math.max(64, Math.round((2048 * w) / d / 32) * 32),
          H =

        const ruled = (x, w, h) => {

        o.sheets = draws.map((dr, i) => {

        o.notes = [0, 1, 2].map((j) => {

        // с френелевыми бликами софтбоксов. Дубля оправы нет: оправа не участвует в «преломлении».
        const uLensC = uniform(new THREE.Vector3()),

          const X = P.add(V.mul(uPlaneY.sub(P.y).div(V.y))),
            Xc = C0.add(Vc.mul(uPlaneY.sub(C0.y).div(Vc.y)));

            .mul(o.uLensK)

              o.chkT = 0;

            if (o.chkT >= 0) o.chkT += dt;
            if (o.chkT > 3.4) o.chkT = -1;
          }
          const tt = k === 6 ? o.tState : k < 0 && o.chkT >= 0 ? o.chkT : -1;
          o.bp.t = tt > 0.2 && tt < 0.5 ? -0.045 : 0;
          o.btn.position.y = 0.02 + o.bp.step(dt);
          o.checks.forEach((L, i) => ledOn(L, tt > 0.55 + i * 0.4, dt, 2.6));
          uChk.value =
            tt < 0.2
              ? 0

        };
        const lbl = CONTENT.parts["7"];

        o.focus = {

      }

      /* ---------- 08 · авторевью MR: три узких штампа и лист MR ---------- */
      function buildStamps() {
        const o = new Obj("8"),

          DX = -0.5,

        const tex = canvasTex(1024, 1208, (x, w, h) => {

          x.fillStyle = "#e9e6df";
          x.fillRect(0, 0, w, 54);
          x.fillStyle = "#2a2a2a";
          x.beginPath();
          x.roundRect(28, 20, 150, 12, 6);
          x.fill();
          x.fillStyle = "#ff5a1a";
          x.beginPath();
          x.roundRect(w - 96, 18, 68, 16, 8);
          x.fill();
          for (let l = 0; l < 26; l++) {
            const y = 76 + l * 19.5,
              kind = rnd();
            const add = kind < 0.22,
              del = !add && kind < 0.36;
            if (add || del) {
              x.fillStyle = add ? "rgba(255,90,26,.12)" : "rgba(30,30,30,.07)";
              x.fillRect(20, y - 6, w - 40, 17);
              x.fillStyle = add ? "#ff5a1a" : "#555";
              x.fillRect(28, y, 8, 3);
              if (add) x.fillRect(30.5, y - 2.5, 3, 8);
            }
            x.fillStyle = "#c4c1ba";
            x.fillRect(48, y, 18, 4);
            x.fillStyle = add ? "#6b4a3a" : "#9d9a93";
            x.beginPath();
            x.roundRect(
              80 + (l % 5) * 14,
              y - 1,
              (0.25 + rnd() * 0.55) * (w - 150),
              6,
              3,
            );
            x.fill();
          }
        });
        tex.flipY = false;
        mk(
          slab(DW, 0.008, DD, { r: 0.03, e: 0.003, seg: 2, eseg: 1 }),
          detail(std({ color: 0xffffff, roughness: 0.94, map: tex }), {
            b: [0.04, 90, 1, 6, 6],
          }),
          g,
          DX,
          0,
          DZ,
        );
        // оттиск: краска ложится неравномерно — зерно резины, светлые пропуски, лёгкий расплыв по кромке
        const ring = (fill) =>
          canvasTex(512, 512, (x, w, h) => {
            x.clearRect(0, 0, w, h);
            x.scale(2, 2);
            x.strokeStyle = fill;
            x.fillStyle = fill;
            x.lineWidth = 16;
            x.shadowColor = fill;
            x.shadowBlur = 1.5;
            x.beginPath();
            x.arc(128, 128, 98, 0, Math.PI * 2);
            x.stroke();
            x.lineWidth = 7;
            x.beginPath();
            x.arc(128, 128, 72, 0, Math.PI * 2);
            x.stroke();
            x.lineWidth = 15;
            x.lineCap = "round";
            x.beginPath();
            x.moveTo(92, 132);
            x.lineTo(118, 158);
            x.lineTo(168, 100);
            x.stroke();
            x.setTransform(1, 0, 0, 1, 0, 0);
            const d = x.getImageData(0, 0, w, h);
            for (let i = 3; i < d.data.length; i += 4) {
              const px = (i >> 2) % w,
                py = ((i >> 2) / w) | 0;
              const n =
                Math.sin(px * 0.9 + py * 0.3) * Math.sin(py * 0.7 - px * 0.2);
              d.data[i] *= Math.min(
                1,
                0.55 +
                  0.35 * rnd() +
                  0.25 * n +
                  ((px * 7 + py * 13) % 97 < 3 ? -0.5 : 0),
              );
            }
            x.putImageData(d, 0, 0);
          });
        const ink = ["#ff5a1a", "#2a2a2a", "#7a7a7a"].map(ring);
        const markAt = [
          [DX - 0.38, DZ - 0.55, 0.2],
          [DX + 0.32, DZ - 0.1, -0.3],
          [DX - 0.2, DZ + 0.5, 0.5],
        ];
        o.marks = markAt.map(([x, z, r], i) => {
          const m = new THREE.MeshBasicNodeMaterial({
            map: ink[i],
            transparent: true,
            opacity: 0,
            depthWrite: false,
          });
          const p = mk(
            new THREE.PlaneGeometry(0.52, 0.52).rotateX(-Math.PI / 2),
            m,
            g,
            x,
            0.0125,
            z,
            { cs: false, cast: false, recv: false },
          );
          p.rotation.y = r;
          p.renderOrder = 3;
          return { m, p, a: 0 };
        });
        o.noise = [];
        for (let i = 0; i < 7; i++) {
          const m = new THREE.MeshBasicNodeMaterial({
            map: ink[2],
            transparent: true,
            opacity: 0,
            depthWrite: false,
          });
          const p = mk(
            new THREE.PlaneGeometry(0.3, 0.3).rotateX(-Math.PI / 2),
            m,
            g,
            DX - 0.7 + rnd() * 1.4,
            0.013,
            DZ - 0.85 + rnd() * 1.7,
            { cs: false, cast: false, recv: false },
          );
          p.rotation.y = rnd() * 6;
          p.renderOrder = 3;
          o.noise.push({ m, a: 0 });
        }
        const rep = grp(g, DX + 0.15, 0, DZ + 0.1);
        const repTex = canvasTex(256, 320, (x, w, h) => {
          x.fillStyle = "#fbfaf7";
          x.fillRect(0, 0, w, h);
          x.fillStyle = "#ff5a1a";
          x.fillRect(0, 0, w, 46);
          for (let l = 0; l < 8; l++) {
            x.fillStyle = l % 3 === 0 ? "#2a2a2a" : "#bab7b0";
            x.beginPath();
            x.roundRect(
              22,
              70 + l * 28,
              (l % 3 === 0 ? 0.35 : 0.5 + rnd() * 0.35) * (w - 44),
              8,
              4,
            );
            x.fill();
          }
        });
        repTex.flipY = false;
        mk(
          slab(0.9, 0.01, 1.15, { r: 0.03, e: 0.003, seg: 2, eseg: 1 }),
          std({ color: 0xffffff, map: repTex, roughness: 0.9 }),
          rep,
          0,
          0,
          0,
        );
        o.rep = rep;
        o.rz = new Spring(0, 90, 13);
        const handles = [M.orange, M.dark, M.white];
        o.stamps = [-0.78, 0, 0.78].map((z, i) => {
          const s = grp(g, 1.12, 0, z);
          mk(slab(0.5, 0.05, 0.5, { r: 0.07, e: 0.02 }), M.rubber, s);
          mk(slab(0.56, 0.2, 0.56, { r: 0.1, e: 0.04 }), M.alu, s, 0, 0.05, 0);
          silk(
            s,
            0.4,
            0.08,
            (x) => {
              mono(x, 0.05, 600);
              x.fillStyle = "#45464a";
              x.textAlign = "center";
              x.fillText("S-0" + (i + 1) + " · INK", 0.2, 0.06);
            },
            { y: 0.15, z: 0.2808, face: "front" },
          );
          mk(
            lathe(
              [
                [0.13, 0],
                [0.13, 0.03],
                [0.09, 0.07],
                [0.075, 0.2],
                [0.11, 0.27],
                [0.2, 0.34],
                [0.22, 0.42],
                [0.18, 0.5],
                [0.1, 0.54],
                [0, 0.55],
              ],
              48,
            ),
            handles[i],
            s,
            0,
            0.25,
            0,
          );
          return {
            s,
            home: new THREE.Vector3(1.12, 0, z),
            seq: -1,
            t: 0,
            target: null,
          };
        });
        const stampTo = (S, mark, delay) => {
          S.seq = 0;
          S.t = -delay;
          S.target = mark;
        };
        o.onState = (pk) => {
          const k = o.fk;
          if (k === 1 && pk < 1)
            o.stamps.forEach((S, i) => stampTo(S, o.marks[i], i * 0.55));
          else if (k >= 1)
            o.marks.forEach((m) => {
              m.a = 1;
            });
          if (k === 2) stampTo(o.stamps[0], o.marks[0], 0.05);
          o.rz.t = k >= 3 ? 1 : 0;
        };
        o.onTick = (dt, t) => {
          const k = o.fk;
          // в обзоре штампы по очереди «пробуют» оттиск — подпрыгивают и опускаются
          if (k < 0) {
            o.tapIdle = (o.tapIdle ?? 4) - dt;
            if (o.tapIdle < 0) {
              o.tapIdle = 5.5;
              o.tapI = ((o.tapI ?? -1) + 1) % 3;
              o.tapT = 0;
            }
            if (o.tapT >= 0) {
              o.tapT += dt;
              if (o.tapT > 0.9) o.tapT = -1;
            }
          }
          o.stamps.forEach((S, i) => {
            let p = S.home.clone(),
              y = 0,
              tilt = 0;
            if (S.seq === 0 && S.target) {
              S.t += dt;
              const T = S.t / 1.15;
              if (T > 0) {
                const tg = S.target.p.position;
                if (T < 0.35) {
                  const e = easeInOut(T / 0.35);
                  p.lerpVectors(S.home, new THREE.Vector3(tg.x, 0, tg.z), e);
                  y = Math.sin((e * Math.PI) / 2) * 0.55;
                  tilt = Math.sin(e * Math.PI) * 0.2;
                } else if (T < 0.55) {
                  p.set(tg.x, 0, tg.z);
                  const e = (T - 0.35) / 0.2;
                  y = 0.55 * (1 - easeInOut(e)) + 0.012;
                  if (e > 0.9) S.target.a = Math.max(S.target.a, 1);
                } else if (T < 0.7) {
                  p.set(tg.x, 0, tg.z);
                  y = 0.012 + easeOut((T - 0.55) / 0.15) * 0.45;
                } else if (T < 1) {
                  const e = easeInOut((T - 0.7) / 0.3);
                  p.lerpVectors(new THREE.Vector3(tg.x, 0, tg.z), S.home, e);
                  y = 0.45 * (1 - e);
                } else {
                  S.seq = -1;
                }
              }
            }
            if (k < 0 && S.seq !== 0 && o.tapI === i && o.tapT >= 0) {
              const u = o.tapT / 0.9;
              y += Math.sin(Math.min(1, u) * Math.PI) * 0.32;
              tilt += Math.sin(Math.min(1, u) * Math.PI * 2) * 0.08;
            }
            S.s.position.set(p.x, y, p.z);
            S.s.rotation.z = tilt * (i - 1.2);
          });
          o.marks.forEach((m) => {
            const want = k >= 1 ? m.a : 0;
            m.m.opacity = damp(m.m.opacity, want > 0.5 ? 0.92 : 0, 12, dt);
            if (k < 1) m.a = 0;
          });
          o.noise.forEach((n, i) => {
            n.m.opacity = damp(
              n.m.opacity,
              k === 4 && o.tState > 0.2 + i * 0.18 ? 0.38 : 0,
              8,
              dt,
            );
          });
          const rz = o.rz.step(dt);
          o.rep.position.set(
            DX + 0.15 + rz * 0.55,
            0.0 + rz * 0.009,
            DZ + 0.1 + rz * 1.05,
          );
          o.rep.rotation.y = -rz * 0.12;
        };
        o.parts = [
          ...CONTENT.parts["8"]
            .slice(0, 3)
            .map((t, i) =>
              part(o.stamps[i].s, 0.32, 0.5, 0, t, i === 0 ? [1, 2] : 1, "r"),
            ),
          part(o.rep, 0.2, 0.02, 0.5, CONTENT.parts["8"][3], 3, "b", [
            o.rep,
            0.2,
            0,
            1.38,
          ]),
        ];
        o.focus = {
          c: new THREE.Vector3(0.2, 0.35, 0.05),
          box: [3.2, 1.0, 2.3],
          yaw: 18,
          pitch: 40,
        };
        return o;
      }

        const flag = grp(o.steps[1].s, 0.12, o.steps[1].h, 0.45);
        mk(

        const fl = mk(
          slab(0.24, 0.01, 0.15, { r: 0.02, e: 0.003, seg: 2, eseg: 1 }),
          M.orange,

          0.12,
          0.4,
          0,
        );
        fl.rotation.x = Math.PI / 2;
        fl.position.set(0.12, 0.42, 0);

        o.fy = new Spring(0, 150, 12);

          slab(0.24, 0.18, 0.24, { r: 0.04, e: 0.02 }),
          M.orange,
          o.steps[2].s,
          0,
          o.steps[2].h,
          0.45,

        blk.visible = false;
        o.blk = blk;
        o.onState = () => {
          const k = o.fk;
          o.steps.forEach((S, i) => {
            S.y.t = k === i + 1 ? 0.1 : 0;
          });
          o.pilots.forEach((P) => {
            if (k >= 6) {
              if (!P.p.visible) {
                P.p.visible = true;
                P.y.snap(1);
                P.y.t = 0;
              }
            } else {
              P.p.visible = false;
            }
          });
          if (k === 7) {
            o.flag.visible = true;
            o.blk.visible = true;
            o.fy.snap(0.001);
            o.fy.t = 1;
          } else if (k < 7) {
            o.flag.visible = false;
            o.blk.visible = false;

        o.onTick = (dt, t) => {
          const k = o.fk;
          o.steps.forEach((S, i) => {
            S.s.position.y = S.y.step(dt);
            S.strip.emissiveIntensity = damp(
              S.strip.emissiveIntensity,
              k === i + 1 ? 2.8 : k === 7 && (i === 1 || i === 2) ? 1.6 : 0,
              9,
              dt,
            );
          });
          o.me.position.y =
            o.steps[0].h +
            (k === 1
              ? Math.abs(Math.sin(t * 3.2)) * 0.08
              : k < 0 && t % 7 < 0.55
                ? Math.sin(((t % 7) / 0.55) * Math.PI) * 0.14
                : 0);
          o.pilots.forEach((P) => {
            P.p.position.y = P.h + Math.max(0, P.y.step(dt));
          });
          const f = Math.max(0.001, o.fy.step(dt));
          o.flag.scale.set(1, f, 1);
          o.blk.scale.setScalar(f);
        };
        o.parts = CONTENT.parts["9"].map((tx, i) =>
          part(
            o.steps[i].s,

            o.steps[i].h - 0.1,
            SD / 2 + 0.002,
            tx,

        o.focus = {

          box: [3.3, 1.35, 1.75],
          yaw: -32,
          pitch: 26,

      }
