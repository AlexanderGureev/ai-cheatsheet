          0x1d1e20, 0xfff3e8, 0x1d1e20, 0x1d1e20, 0xeceae5, 0x1d1e20, 0x1d1e20,
        ];
        // логотип на площадке-легенде: маска (белое на чёрном) — краска тампопечати и «просвет» подсветки
        const LPX = 1100,
          LH = 0.27;
        const legendMask = (pw, pd, keys) => {
          const t = canvasTex(
            Math.round(pw * LPX),
            Math.round(pd * LPX),
            (x, cw, ch) => {
              x.fillStyle = "#000";
              x.fillRect(0, 0, cw, ch);
              x.fillStyle = "#fff";
              x.strokeStyle = "#fff";
              const s = LH * LPX,
                gap = s * 0.42,
                tw = keys.length * s + (keys.length - 1) * gap;
              keys.forEach((k, j) => {
                const L = LOGO[k],
                  [vx, vy, vw, vh] = L.vb.split(" ").map(Number),
                  f = s / Math.max(vw, vh);
                x.save();
                x.translate(
                  cw / 2 - tw / 2 + j * (s + gap) + (s - vw * f) / 2,
                  ch / 2 - (vh * f) / 2,
                );
                x.scale(f, f);
                x.translate(-vx, -vy);
                const P2 = new Path2D(L.d);
                x.fill(P2, L.rule || "nonzero");
                if (L.w) {
                  x.lineWidth = L.w;
                  x.lineJoin = "round";
                  x.stroke(P2);
                }
                x.restore();
              });
            },
          );
          t.colorSpace = THREE.NoColorSpace;
          t.flipY = false;
          return t; // flipY: верх рисунка — к дальнему краю клавиши
        };
        o.keys = K.map(([x, z, w], i) => {
          const kg = grp(g, x, 0.205, z);
          mk(
            slab(w, 0.34, 0.72, { r: 0.13, e: 0.085, taper: 0.075, eseg: 5 }),
            mats[i],
            kg,
          );
          // площадка-легенда с логотипом и подсветкой изнутри: у нажатой клавиши светится сам логотип (просвет), площадка — едва
          const lm = std({
            color: legendBase[i],
            roughness: 0.6,
            emissive: new THREE.Color(0xff6a26),
            emissiveIntensity: 0,
          });
          const pw = w - 0.26,
            pd = 0.36,
            mask = texture(legendMask(pw, pd, TOOL_LOGOS[i]), uv()).r;
          const cb = new THREE.Color(legendBase[i]),
            ci = new THREE.Color(legendInk[i]);
          lm.colorNode = mix(
            vec3(cb.r, cb.g, cb.b),
            vec3(ci.r, ci.g, ci.b),
            mask,
          );
          lm.roughnessNode = mix(float(0.6), float(0.38), mask);
          lm.emissiveNode = materialEmissive.mul(mask.mul(0.88).add(0.12));
          mk(
            slab(pw, 0.006, pd, { r: 0.1, e: 0.003, seg: 4, eseg: 1 }),
            lm,
            kg,
            0,
            0.34,
            -0.02,
            { cs: false },
          );
          const hs = glowSpot(g, x, 0.2115, z, w * 1.75);
          return { kg, lm, y: new Spring(0, 520, 17), hs, v: 0, w, press: -1 };
        });
        // щелчок: клавиша резко проваливается (70 мс), держится и отскакивает с перелётом, оставаясь подсвеченной
        const click = (K_) => {
          K_.press = 0;
        };
        o.onState = (pk) => {
          const k = o.fk;
          o.keys.forEach((K_, i) => {
            if (k === i + 1 && pk !== k) click(K_);
          });
        };
        o.idle = 3;
        o.onTick = (dt, t) => {
          const k = o.fk;
          if (k < 0 && o.mode !== "intro") {
            o.idle -= dt;
            if (o.idle < 0) {
              o.idle = 3 + Math.random() * 2.5;
              click(o.keys[Math.floor(Math.random() * o.keys.length)]);
            }
          }
          o.keys.forEach((K_, i) => {
            const cur = k === i + 1;
            if (K_.press >= 0) {
              K_.press += dt;
              if (K_.press < 0.07) K_.y.snap((-0.12 * K_.press) / 0.07);
              else if (K_.press < 0.2) K_.y.snap(-0.12);
              else {
                K_.y.t = cur ? -0.03 : 0;
                K_.press = -1;
              }
            } else K_.y.t = cur ? -0.03 : 0;
            K_.kg.position.y = 0.205 + K_.y.step(dt);
            const flash = K_.press >= 0 && K_.press < 0.35 ? 1 : 0;
            K_.v = damp(K_.v, cur ? 1 : flash * 0.6, flash ? 30 : 7, dt);
            K_.hs.material.opacity = K_.v * (0.5 + 0.08 * Math.sin(t * 5));
            K_.hs.visible = K_.v > 0.01;
            K_.lm.emissiveIntensity = K_.v * 2.2;
          });
        };
        // подписи клавиш — выносками за корпус: верхний ряд над клавиатурой, нижний — под ней
        // точка выноски — у кромки клавиши со стороны плашки, чтобы не ложиться на логотип
        o.parts = CONTENT.parts["10"].map((tx, i) => {
          const [x, z] = K[i];
          return part(
            o.keys[i].kg,
            0,
            0.335,
            z < 0 ? -0.19 : 0.17,
            tx,
            i + 1,
            z < 0 ? "t" : "b",
            [g, x, z < 0 ? 0.2 : 0, z < 0 ? -1.28 : 1.3],
          );
        });
        o.focus = {
          c: new THREE.Vector3(0, 0.3, 0),
          box: [3.5, 0.6, 2.0],
          yaw: 14,
          pitch: 50,
        };
        return o;
      }

      /* ---------- 11 · восемь стопок листов: 1 лист = 1 тыс. строк, высота строго ∝ числу строк ----------
   Торцы стопок — строки листов (шейдер торцов, каждые 10 листов — линия плотнее); у текущего проекта
   верхний лист оранжевый. В фокусе стопки растут лист за листом синхронно со счётчиком, будущий объём
   показан тонким стеклянным контуром. Рядом — мерная рейка 0–200 тыс. */
      function buildBars() {
        const o = new Obj("11"),
          g = o.inner,
          P = CONTENT.blocks["11"].projects,
          N = P.length;
        const BASEH = 0.16,
          SW = 0.84,
          SD = 0.64,
          Z0 = -0.05,
          HMAX = 3.3,
          T = HMAX / 193;
        mk(
          slab(10.1, BASEH, 1.5, { r: 0.22, e: 0.05, seg: 10 }),
          M.aluBrushed,
          g,
        );
        screws(
          g,
          [
            [-4.86, -0.56],
            [4.86, -0.56],
            [-4.86, 0.56],
            [4.86, 0.56],
          ],
          BASEH,
          0.85,
        );
        silk(
          g,
          3.2,
          0.1,
          (x) => {
            mono(x, 0.05, 600);
            x.fillStyle = "#5a5b5f";
            x.fillText("PRJ-11 · 1 SHEET = 1K LOC", 0.02, 0.07);
          },
          { x: 2.9, y: BASEH + 0.0005, z: 0.62 },
        );
        // мерная рейка: деления через 10 тыс., подписи через 50 тыс.
        const RH = 200 * T;
        mk(
          slab(0.14, RH + 0.04, 0.08, { r: 0.02, e: 0.01, seg: 3 }),
          M.aluDark,
          g,
          -5.0 + 0.1,
          BASEH,
          Z0 - 0.24,
        );
        silk(
          g,
          0.14,
          RH,
          (x) => {
            x.strokeStyle = INK_W;
            x.fillStyle = INK_W;
            mono(x, 0.045, 600);
            x.textAlign = "left";
            for (let v = 0; v <= 200; v += 10) {
              const y = RH - v * T,
                big = v % 50 === 0;
              x.lineWidth = big ? 0.008 : 0.005;
              x.beginPath();
              x.moveTo(0, y);
              x.lineTo(big ? 0.06 : 0.035, y);
              x.stroke();
              if (big && v) x.fillText(String(v), 0.066, y + 0.016);
            }
          },
          {
            x: -5.0 + 0.1,
            y: BASEH + RH / 2,
            z: Z0 - 0.24 + 0.0405,
            face: "front",
          },
        );
        // материал стопки: бумага, на торцах — линии листов (по мировой высоте от основания стопки — не «плывут» при росте)
        const ream = detail(std({ color: 0xf2f0ea, roughness: 0.93 }), {
          b: [0.04, 90, 1, 6, 6],
        });
        {
          const org = modelWorldMatrix.mul(vec4(0, 0, 0, 1)).y,
            sx = length(modelWorldMatrix.mul(vec4(1, 0, 0, 0)).xyz);
          const yRel = positionWorld.y.sub(org).div(sx.mul(T)),
            side = float(1).sub(abs(normalLocal.y)).clamp(0, 1);
          const w = fwidth(yRel),
            f = fract(yRel),
            vis = float(1).sub(smoothstep(0.25, 0.55, w));
          const line = smoothstep(0.55, 0.62, f)
            .mul(float(1).sub(smoothstep(0.8, 0.9, f)))
            .mul(0.11)
            .mul(vis);
          const d10 = abs(fract(yRel.div(10).add(0.5)).sub(0.5)).mul(10);
          const line10 = float(1)
            .sub(smoothstep(0.15, max(w, 0.3).add(0.15), d10))
            .mul(0.14)
            .mul(float(1).sub(smoothstep(2.5, 5, w)));
          ream.colorNode = vec3(0.91, 0.9, 0.87).mul(
            float(1).sub(line.add(line10).mul(side)).sub(side.mul(0.03)),
          );
        }
        const STACK = slab(SW, 1, SD, { r: 0.018, e: 0.002, seg: 2, eseg: 1 });
        const page = canvasTex(512, 392, (x, w, h) => {
          x.fillStyle = "#f6f4ef";
          x.fillRect(0, 0, w, h);
          for (let l = 0; l < 13; l++) {
            x.fillStyle = l % 4 === 0 ? "#9a978f" : "#c9c6be";
            x.beginPath();
            x.roundRect(
              40 + (l % 3) * 18,
              36 + l * 25,
              (0.3 + rnd() * 0.45) * (w - 110),
              8,
              4,
            );
            x.fill();
          }
        });
        page.flipY = false;
        const pageMat = detail(
          std({ color: 0xffffff, map: page, roughness: 0.92 }),
          { b: [0.04, 90, 1, 6, 6] },
        );
        const pageCur = std({ color: 0xff6a2a, map: page, roughness: 0.8 });
        o.pageMats = [pageMat, pageCur];
        o.bars = P.map((p, i) => {
          const x = -4.3 + i * 1.23,
            H = p.k * T;
          mk(
            slab(SW + 0.07, 0.006, SD + 0.07, {
              r: 0.05,
              e: 0.002,
              seg: 3,
              eseg: 1,
            }),
            M.black,
            g,
            x,
            BASEH,
            Z0,
            { cs: false },
          );
          const stack = mk(STACK, ream, g, x, BASEH, Z0);
          stack.scale.y = H;
          const top = mk(
            slab(SW, T * 0.85, SD, { r: 0.018, e: 0.001, seg: 2, eseg: 1 }),
            pageMat,
            g,
            x,
            BASEH + H,
            Z0,
            { cs: false },
          );
          // стеклянный контур будущей стопки: прозрачность растёт к скользящим углам (френель) — читаются рёбра и блики софтбоксов
          const gm = phys({
              color: 0xffffff,
              roughness: 0.04,
              metalness: 0,
              clearcoat: 1,
              clearcoatRoughness: 0.03,
              transparent: true,
              depthWrite: false,
            }),
            ga = uniform(0);
          gm.opacityNode = float(0.05)
            .add(
              pow(
                float(1).sub(abs(dot(normalView, normalize(positionView)))),
                2.2,
              ).mul(0.62),
            )
            .mul(ga);
          const ghost = mk(
            slab(SW + 0.03, H + 0.012, SD + 0.03, {
              r: 0.03,
              e: 0.006,
              seg: 3,
              eseg: 2,
            }),
            gm,
            g,
            x,
            BASEH,
            Z0,
            { cs: false, cast: false, recv: false },
          );
          ghost.renderOrder = 5;
          ghost.visible = false;
          return {
            stack,
            top,
            ghost,
            gm,
            ga,
            H,
            x,
            grow: new Spring(1, 70, 12.5),
            cur: false,
            k: p.k,
            shown: 1,
            n: p.k,
          };
        });
        o.onState = (pk, pf) => {
          const k = o.fk;
          const entering = o.focused && !pf;
          o.bars.forEach((B, i) => {
            if (!o.focused) B.grow.t = 1;
            else if (k === 0) {
              B.grow.t = 0;
            } else if (k <= N) {
              B.grow.t = i < k ? 1 : 0;
            } else B.grow.t = 1;
            B.delay = entering && B.grow.t === 0 ? (N - 1 - i) * 0.05 : 0;
            B.cur =
              o.focused &&
              ((k >= 1 && k <= N && i === k - 1) ||
                (k === N + 2 && i === 0) ||
                (k === N + 3 && i === 5) ||
                (k === N + 4 && i === 6));
            B.top.material = B.cur ? pageCur : pageMat;
          });
        };
        o.onTick = (dt) => {
          o.bars.forEach((B, i) => {
            if (B.delay > 0) {
              B.delay -= dt;
            } else {
              B.grow.step(dt);
            }
            // лист за листом: видимая высота — целое число листов, счётчик подписи показывает то же число
            const n = Math.round(clamp01(B.grow.x) * B.k),
              h = n * T;
            B.stack.scale.y = Math.max(1e-4, h);
            B.stack.visible = n > 0;
            B.top.position.y = BASEH + h;
            B.top.visible = n > 0;
            B.n = n;
            B.shown = n / B.k;
            B.ga.value = damp(B.ga.value, o.focused && n < B.k ? 1 : 0, 8, dt);
            B.ghost.visible = B.ga.value > 0.004;
            // если подпись слишком близко по высоте к соседней слева — поднимаем её на ярус выше, чтобы плашки не наезжали
            let ly = BASEH + h + 0.24;
            const pl = i ? o.bars[i - 1].ly : null;
            if (pl != null && Math.abs(ly - pl) < 0.66) ly = pl + 0.66;
            B.ly = ly;
            if (o.parts[i]) {
              o.parts[i].off.set(B.x, BASEH + h + 0.02, Z0);
              if (i === N - 1)
                o.parts[i].at[1].set(B.x + 0.62, BASEH + h + 0.3, Z0);
              else o.parts[i].at[1].set(B.x + 0.32, ly, Z0);
            }
          });
        };
        // подпись — над вершиной стопки, чуть правее: подальше от более высокой соседки слева
        o.parts = P.map((p, i) =>
          part(
            g,
            o.bars[i].x,
            BASEH + 0.02,
            Z0,
            p.name,
            i + 1,
            i === N - 1 ? "r" : "t",
            [g, o.bars[i].x + 0.32, BASEH + 0.24, Z0],
          ),
        );
        // камера низко и близко, широкий угол — стопки встают как панорама города, самая высокая — на переднем плане слева
        o.focus = {
          c: new THREE.Vector3(0.4, 1.05, 0),
          box: [10.2, 3.2, 1.5],
          yaw: -27,
          pitch: 11,
          fov: 25,
        };
        return o;
      }

      /* ---------- Главное · пульт с тремя фейдерами ---------- */
      function buildFaders() {
        const o = new Obj("g"),
          g = o.inner,
          CH = 0.42;
        mk(slab(3.2, CH, 1.96, { r: 0.24, e: 0.1, eseg: 5 }), M.aluBrushed, g);
        screws(
          g,
          [
            [-1.42, -0.78],
            [1.42, -0.78],
            [-1.42, 0.78],
            [1.42, 0.78],
          ],
          CH,
          0.8,
        );
        const XS = [-0.92, 0, 0.92],
          caps = [M.anoOrange, M.aluBrushed, M.anoDark],
          lines = [M.white, M.orange, M.orange];
        // шкала дБ у каждой прорези, номера каналов, код модели
        silk(
          g,
          3.0,
          1.8,
          (x) => {
            const DB = [
              ["+6", -0.62],
              ["0", -0.38],
              ["-6", -0.14],
              ["-12", 0.1],
              ["-24", 0.34],
              ["-48", 0.58],
              ["-∞", 0.74],
            ];
            x.strokeStyle = "#3d3e42";
            x.fillStyle = "#3d3e42";
            x.lineCap = "round";
            XS.forEach((X, i) => {
              const cx = 1.5 + X;
              for (let j = 0; j <= 28; j++) {
                const z = 0.9 - 0.66 + j * (1.4 / 28),
                  big = j % 4 === 0;
                x.lineWidth = big ? 0.007 : 0.004;
                x.beginPath();
                x.moveTo(cx - 0.2, z);
                x.lineTo(cx - (big ? 0.13 : 0.16), z);
                x.stroke();
              }
              mono(x, 0.042, 600);
              x.textAlign = "right";
              for (const [t, z] of DB)
                x.fillText(t, cx - 0.22, 0.9 + z + 0.015);
              mono(x, 0.06, 700);
              x.textAlign = "center";
              x.fillText(String(i + 1), cx, 1.75);
            });
            mono(x, 0.045, 600);
            x.textAlign = "left";
            x.fillText("MIX-G · REV 2", 0.1, 0.07);
            x.textAlign = "right";
            x.fillText("dB", 2.9, 0.07);
          },
          { y: CH + 0.0005, z: 0 },
        );
        o.f = XS.map((x, i) => {
          mk(
            slab(0.13, 0.01, 1.42, { r: 0.06, e: 0.004 }),
            M.black,
            g,
            x,
            CH,
            0.05,
            { cs: false },
          );
          const fc = grp(g, x, CH, 0);
          // колпачок фейдера: анодированный алюминий с линейной шлифовкой, риска-вставка
          mk(slab(0.52, 0.2, 0.3, { r: 0.07, e: 0.045 }), caps[i], fc);
          mk(
            new THREE.BoxGeometry(0.4, 0.006, 0.022),
            lines[i],
            fc,
            0,
            0.203,
            0,
            { cs: false, cast: false },
          );
          const leds = [];
          for (let j = 0; j < 7; j++) {
            const L = std({
              color: 0x1b1b1b,
              emissive: new THREE.Color(0xff5a1a),
              emissiveIntensity: 0,
            });
            mk(
              slab(0.06, 0.008, 0.06, { r: 0.012, e: 0.003, seg: 2, eseg: 1 }),
              L,
              g,
              x + 0.34,
              CH,
              0.62 - j * 0.19,
              { cs: false, cast: false },
            );
            leds.push({ m: L, v: 0 });
          }
          return { fc, z: new Spring([0.3, -0.1, 0.42][i], 60, 11), leds };
        });
        const SET = [-0.42, -0.55, -0.3];
        o.onState = () => {
          const k = o.fk;
          o.f.forEach((F, i) => {
            F.z.t = o.focused
              ? k === 0
                ? SET[i]
                : k === 1
                  ? SET[i] + (i === 0 ? 0.18 : 0)
                  : SET[i] - 0.1
              : [0.3, -0.1, 0.42][i];
            F.delay = o.focused && k === 0 ? i * 0.35 : 0;
          });
        };
        o.onTick = (dt, t) => {
          const k = o.fk;
          o.f.forEach((F, i) => {
            if (F.delay > 0) F.delay -= dt;
            else F.z.step(dt);
            F.fc.position.z =
              F.z.x + (o.focused ? 0 : Math.sin(t * 0.35 + i * 2.1) * 0.06);
            const lvl =
              clamp01((0.62 - F.z.x) / 1.3) * 7 +
              (o.focused
                ? 0
                : (Math.sin(t * 7.3 + i * 2) * 0.5 +
                    Math.sin(t * 13.1 + i) * 0.35) *
                  1.2);
            F.leds.forEach((L, j) => {
              L.v = damp(L.v, j < lvl ? 1 : 0, 10, dt);
              L.m.emissiveIntensity = L.v * (k === 2 ? 2.6 : 1.7);
            });
          });
        };
        o.parts = CONTENT.parts["g"].map((tx, i) =>
          part(o.f[i].fc, 0, 0.21, 0.1, tx, null, "b", [g, XS[i], 0, 1.3]),
        );
        o.focus = {
          c: new THREE.Vector3(0, 0.3, 0),
          box: [3.2, 0.7, 2.0],
          yaw: 22,
          pitch: 46,
        };
        return o;
      }

      /* =====================================================================================
   SCENE ASSEMBLY
   ===================================================================================== */
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      const md = (s) =>
        esc(s)
          .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
          .replace(/`(.+?)`/g, "<code>$1</code>")
          .replace(/← мы здесь/, '<span class="here">← мы здесь</span>');
      const chainEls = [];
      const OBJ = {};
      OBJ.hero = buildAmp();
      let cablePulse = null; // импульс по кабелю на каждом шаге цикла (кабель собирается после расстановки предметов и подиумов)
      OBJ["1"] = buildSwitch((i) => {
        chainEls.forEach((e, j) => e.classList.toggle("on", j === i));
        cablePulse && cablePulse(i);
      });
      OBJ["2"] = buildClipboard();
      OBJ["3"] = buildPad();
      OBJ["4"] = buildLoupe();
      OBJ["5"] = buildStack();
      OBJ["6"] = buildBoard();
      OBJ["7"] = buildFiles();
      OBJ["8"] = buildStamps();
      OBJ["9"] = buildStairs();
      OBJ["10"] = buildKeys();

      const ALL = [OBJ.hero, ...ORDER.map((id) => OBJ[id])];

      // предметы чуть меньше, чтобы освободить место крупному тексту обзора

      /* ---------- кабель: усилитель → столешницы «Процесс» → «Фундамент» → «Команда» → «Практика» → «Главное» ----------
   Предметы связаны со своей столешницей без провода, а столешницы — между собой: на каждой гнёзда входа и выхода
   (внутри столешницы они соединены). Провод от штекера ложится на верх, огибает кромку, провисает в зазор и
   поднимается на соседний подиум. Импульс: на каждом шаге цикла — от усилителя до «Процесса», в начале нового
   цикла — по всей цепочке; принятый сигнал зажигает кольцо гнезда, а в цепочке — и предметы этой столешницы. */
      const cable = (() => {
        const R = 0.028,
          W = 0.3,
          SPEED = 3.6,
          V = (x, y, z) => new THREE.Vector3(x, y, z),
          UP = V(0, 1, 0),
          X = V(1, 0, 0),
          Z = V(0, 0, 1),
          POD = {};
        MATS.forEach((m, i) => {
          POD[m.g] = PODS[i];
        });
        // гнездо в столешнице: алюминиевое кольцо с тёмным отверстием и кольцо активности вокруг (светится при приёме)
        const RING = lathe(
          [
            [0.04, 0],
            [0.074, 0],
            [0.074, 0.004],
            [0.066, 0.009],
            [0.044, 0.009],
            [0.04, 0.004],
          ],
          40,
        );
        const HOLE = new THREE.CircleGeometry(0.042, 32).rotateX(-Math.PI / 2),
          HALO = new THREE.RingGeometry(0.078, 0.09, 40).rotateX(-Math.PI / 2);
        const ports = [];
        const port = (g, x, z, dir) => {
          const p = V(x, POD[g].h, z);
          mk(RING, M.aluDark, scene, p.x, p.y, p.z, { cs: false, cast: false });
          mk(HOLE, M.black, scene, p.x, p.y + 0.006, p.z, {
            cs: false,
            cast: false,
          });
          const m = ledMat();
          m.polygonOffset = true;
          m.polygonOffsetFactor = -2;
          m.polygonOffsetUnits = -2;
          mk(HALO, m, scene, p.x, p.y + 0.001, p.z, { cs: false, cast: false });
          const P = { g, p, d: dir, m, v: 0 };
          ports.push(P);
          return P;
        };
        // угловой штекер: алюминиевая гильза в гнезде и оранжевый хвостовик, лежащий низко в сторону провода
        const plugMat = detail(
          phys({
            color: 0xff5a1a,
            roughness: 0.42,
            clearcoat: 0.3,
            clearcoatRoughness: 0.4,
          }),
          { rf: [0.04, 120] },
        );
        const BOOT = new THREE.CylinderGeometry(0.031, 0.037, 0.1, 20)
          .rotateZ(-Math.PI / 2)
          .translate(0.05, 0, 0);
        const plug = (p, d) => {
          const g = new THREE.Group();
          g.position.copy(p);
          g.rotation.y = Math.atan2(-d.z, d.x);
          scene.add(g);
          mk(
            new THREE.CylinderGeometry(0.046, 0.046, 0.034, 24).translate(
              0,
              0.017,
              0,
            ),
            M.alu,
            g,
            0,
            0,
            0,
            { cs: false },
          );
          mk(new THREE.SphereGeometry(0.039, 20, 12), plugMat, g, 0, 0.066, 0, {
            cs: false,
          });
          mk(BOOT, plugMat, g, 0, 0.066, 0);
          return p
            .clone()
            .addScaledVector(d, 0.1)
            .add(V(0, 0.066, 0)); // конец хвостовика — отсюда начинается провод
        };
        // провод между гнёздами соседних подиумов по оси перехода (x — соседи в ряду, z — соседние ряды): лежит на верхе,
        // огибает кромку и чуть провисает над зазором; у высокой стенки спускается по ней
        const drape = (A, B) => {
          const ax = Math.abs(A.d.x) > 0.5 ? "x" : "z",
            sg = Math.sign(A.d[ax]),
            qa = POD[A.g],
            qb = POD[B.g],
            ha = qa.h,
            hb = qb.h;
          const eA = sg > 0 ? qa[ax + "1"] : qa[ax + "0"],
            eB = sg > 0 ? qb[ax + "0"] : qb[ax + "1"],
            mid = (eA + eB) / 2,
            lo = Math.min(ha, hb);
          const at = (s, y) => {
            const v = A.p.clone();
            v[ax] = s;
            v.y = y;
            return v;
          };
          const tA = plug(A.p, A.d),
            tB = plug(B.p, B.d);
          const pts = [
            tA,
            tA
              .clone()
              .addScaledVector(A.d, 0.04)
              .setY(ha + 0.05),
            at(A.p[ax] + sg * 0.22, ha + R),
            at(eA - sg * 0.07, ha + R),
            at(eA + sg * 0.01, ha - 0.004),
          ];
          if (ha - hb > 0.12)
            pts.push(at(eA + sg * (R + 0.012), (ha + hb) / 2 - 0.03));
          pts.push(at(mid, lo - 0.05));
          if (hb - ha > 0.12)
            pts.push(at(eB - sg * (R + 0.012), (ha + hb) / 2 - 0.03));
          pts.push(
            at(eB - sg * 0.01, hb - 0.004),
            at(eB + sg * 0.07, hb + R),
            at(B.p[ax] - sg * 0.22, hb + R),
            tB
              .clone()
              .addScaledVector(B.d, 0.04)
              .setY(hb + 0.05),
            tB,
          );
          return pts;
        };
        // усилитель стоит на полу вплотную к «Процессу»: короткий штекер в OUT, провод сразу поднимается на столешницу
        const amp = OBJ.hero.inner.localToWorld(OBJ.hero.port.clone()),
          pp = POD.process;
        const procIn = port("process", wx(668), amp.z, X.clone().negate()),
          procOut = port("process", wx(676), wz(357), Z);
        const baseIn = port("base", wx(676), wz(424), Z.clone().negate()),
          baseOut = port("base", wx(993), wz(560), X);
        const teamIn = port("team", wx(1066), wz(560), X.clone().negate()),
          teamOut = port("team", wx(1066), wz(700), Z);
        const pracIn = port("practice", wx(1066), wz(768), Z.clone().negate()),
          pracOut = port("practice", wx(1381), wz(800), X);
        const mainIn = port("main", wx(1449), wz(800), X.clone().negate());
        // штекер в OUT усилителя — прямой и короткий (до стенки подиума 0,17)
        const ag = new THREE.Group();
        ag.position.copy(amp);
        ag.quaternion.setFromUnitVectors(UP, X);
        scene.add(ag);
        mk(
          new THREE.CylinderGeometry(0.046, 0.046, 0.045, 24).translate(
            0,
            0.0225,
            0,
          ),
          M.alu,
          ag,
          0,
          0,
          0,
          { cs: false },
        );
        mk(
          new THREE.CylinderGeometry(0.037, 0.031, 0.06, 20).translate(
            0,
            0.075,
            0,
          ),
          plugMat,
          ag,
        );
        const tAmp = amp.clone().addScaledVector(X, 0.105),
          tIn = plug(procIn.p, procIn.d);
        const routes = [
          [
            [
              tAmp,
              tAmp.clone().addScaledVector(X, 0.02),
              V(pp.x0 - 0.01, pp.h - 0.004, amp.z),
              V(pp.x0 + 0.07, pp.h + R, amp.z),
              V(procIn.p.x - 0.22, pp.h + R, amp.z),
              tIn
                .clone()
                .addScaledVector(procIn.d, 0.04)
                .setY(pp.h + 0.05),
              tIn,
            ],
            procIn,
          ],
          [drape(procOut, baseIn), baseIn],
          [drape(baseOut, teamIn), teamIn],
          [drape(teamOut, pracIn), pracIn],
          [drape(pracOut, mainIn), mainIn],
        ];
        const C = routes.map(([pts, to]) => {
          const curve = new THREE.CatmullRomCurve3(pts, false, "centripetal"),
            L = curve.getLength(),
            uP = uniform(-1),
            uA = uniform(0);
          const mat = detail(
            phys({
              color: 0xff5a1a,
              roughness: 0.42,
              clearcoat: 0.3,
              clearcoatRoughness: 0.4,
            }),
            { rf: [0.04, 120] },
          );
          mat.emissiveNode = vec3(1, 0.45, 0.16).mul(
            exp(
              uv()
                .x.sub(uP)
                .mul(L / W)
                .pow(2)
                .negate(),
            )
              .mul(uA)
              .mul(2.6),
          );
          mk(
            new THREE.TubeGeometry(curve, Math.ceil(L * 90), R, 10, false),
            mat,
            scene,
          );
          return { L, uP, uA, to, on: false, t: 0, hit: false };
        });
        let chain = null;
        const start = (c) => {
          c.on = true;
          c.t = 0;
          c.hit = false;
        };
        const arrive = (c) => {
          c.to.v = 1;
          const i = C.indexOf(c);
          if (!chain || chain.i !== i) return;
          // сигнал дошёл до столешницы — её предметы на миг «отвечают» (беспроводная связь со столешницей)
          if (chain.last > 0)
            for (const id of ORDER)
              if (GROUP_OF_MAT[id] === c.to.g)
                OBJ[id].glow = Math.max(OBJ[id].glow || 0, 0.32);
          if (chain.i < chain.last) {
            chain.i++;
            chain.wait = 0.1;
          } else chain = null;
        };
        return {
          C,
          ports,
          pulse(full) {
            chain = { i: 0, last: full ? C.length - 1 : 0, wait: 0 };
            start(C[0]);
          },
          tick(dt) {
            if (chain && chain.wait > 0 && (chain.wait -= dt) <= 0)
              start(C[chain.i]);
            for (const c of C) {
              if (!c.on) continue;
              c.t += dt;
              const u = (c.t * SPEED - W) / c.L;
              c.uP.value = u;
              c.uA.value = 1;
              if (!c.hit && u >= 1) {
                c.hit = true;
                arrive(c);
              }
              if (u > 1 + (2 * W) / c.L) {
                c.on = false;
                c.uA.value = 0;
              }
            }
            for (const P of ports) {
              P.v = damp(P.v, 0, 3.2, dt);
              P.m.emissiveIntensity = 0.16 + P.v * 2.6;
            }
          },
        };
      })();
      cablePulse = (i) => cable.pulse(i === 0);

      /* =====================================================================================
   WORLD LABELS — HTML поверх сцены, привязанные к точкам стола (масштаб — как у перспективы)
   ===================================================================================== */
      const worldEl = document.getElementById("world");

        }
        BLK[id] = addWL(

      }
      // подпись hero — левее и выше усилителя, с воздухом до него и до подиума «Процесс» (дизайн-px, пол)
      const HERO_AT = [-14, -4];
      {
        const H = CONTENT.hero;
        const chain = H.chain
          .map(
            (c, i) =>
              `<span><i></i>${esc(c)}</span>${i < H.chain.length - 1 ? "<em>→</em>" : ""}`,
          )

        const w = addWL(
          "hero",
          `<div class="h-title">${esc(H.title)}</div><div class="h-sub">${esc(H.subtitle)}</div><div class="h-chain">${chain}</div><div class="h-quote">${esc(H.quote)}</div><div class="h-src">— ${esc(H.source)}</div>`,

        chainEls[0].classList.add("on");
      }
      for (const m of MATS) {
        const G = CONTENT.groups.find((g) => g.id === m.g);
        if (!G) continue;
        addWL(
          "grp",
          `${esc(G.title)}<span>${m.range}</span>`,
          W3(m.x + PAD_X, m.y + 28, m.ht),
          { kind: "grp" },
        );
      }
      addWL("foot", md(CONTENT.footer), W3(960, 1088, 0), {
        kind: "foot",
        center: true,
      });
      {
        // подписи под брусками блока 11
        const o = OBJ["11"];
        o.bars.forEach((B, i) => {
          const p = CONTENT.blocks["11"].projects[i];
          const a = new THREE.Vector3(B.x, 0, 1.25);
          o.inner.localToWorld(a); // ниже передней кромки основания: зазор ≥ 20 px при 1080p
          addWL("tag", `<b>${esc(p.name)}</b><span>${esc(p.lines)}</span>`, a, {
            kind: "tag",
            center: true,
          });
        });
      }
      // эталонная камера обзора (16:9) — для масштаба подписей: в обзоре подписи в той же пропорции к предметам, что и в макете
      // эталонная камера — обзор 16:9: в нём каждая подпись ровно в дизайн-размере, а ширина колонки текста
      // равна видимой ширине ячейки на этой глубине (перспектива сужает дальний ряд)
      function computeDref() {
        const f = fitOverview(16 / 9),
          ref = new THREE.PerspectiveCamera(DES.FOV, 16 / 9, 1, 900);
        placeCam(ref, f.x, 0, f.z, f.dist, DES.PITCH, DES.YAW);
        ref.updateProjectionMatrix();
        const v = new THREE.Vector3(),
          a = new THREE.Vector3(),

        WL.forEach((w) => {
          v.copy(w.anchor).applyMatrix4(ref.matrixWorldInverse);
          w.dref = -v.z;
          if (w.cell) {
            a.copy(W3(w.cell[0], w.cell[2], w.anchor.y)).project(ref);
            b.copy(W3(w.cell[1], w.cell[2], w.anchor.y)).project(ref);
            w.el.style.setProperty(
              "--w",
              Math.round(((b.x - a.x) / 2) * 1920) + "px",
            );

        });
      }
      const css = document.createElement("style");

      /* =====================================================================================

      const fxEl = document.getElementById("fx"),

        } else {

          B.points.forEach((p, i) => {

          if (id === "g")

        return h;
      }
      const panes = {};
      let paneId = null,
        paneTimer = 0,
        paneK = 0;
      function ensurePane(id) {
        if (!panes[id]) {
          const el = document.createElement("div");

      }
      // если пунктов больше, чем помещается (маленькое окно), список плавно прокручивается к текущему пункту
      function fitPts(id, k) {
        const el = panes[id];

        if (id === "g") {
          const pts = el.querySelector(".fx-pts"),
            st = el.querySelector(".fx-stats");

        }

          inn = el.querySelector(".pts-in");

        if (over > 2 && k > 0) {

            inn.querySelector(`[data-k="${k}"] .nm`) ||

      }
      function showPane(id, k, delay) {
        if (paneId !== id) {
          if (paneId && panes[paneId]) panes[paneId].classList.remove("on");
          ensurePane(id);
          paneId = id;

          paneTimer = setTimeout(() => {

        );
        paneK = k;
        fitPts(id, k);
        setTimeout(() => {
          if (paneId === id && paneK === k) fitPts(id, k);
        }, 620);
      }
      function hidePane() {
        clearTimeout(paneTimer);
        if (paneId && panes[paneId]) panes[paneId].classList.remove("on");
        paneId = null;
      }

      /* part labels + выноски */
      let PL = [],
        plId = null,
        plK = 0,
        plA = 0;
      const linkPath = document.createElementNS(SVGNS, "path");
      linkPath.setAttribute("class", "ln cur");
      function buildParts(id) {
        partsEl.innerHTML = "";
        svgEl.innerHTML = "";
        PL = [];
        plId = id;
        plA = 0;
        const o = OBJ[id];
        if (!o) return;
        o.parts.forEach((p, i) => {
          const el = document.createElement("div");
          el.className =
            "pl" + (p.side === "c" ? " c" : "") + (id === "11" ? " bar" : "");
          const lg =
            id === "10" && TOOL_LOGOS[i]
              ? TOOL_LOGOS[i].map(logoSVG).join("")
              : "";
          el.innerHTML = `<span class="k">${lg}${esc(p.text)}${id === "11" ? '<span class="cnt"></span>' : ""}</span>`;
          partsEl.appendChild(el);
          const lo = document.createElementNS(SVGNS, "path");
          lo.setAttribute("class", "lo");
          svgEl.appendChild(lo);
          const ln = document.createElementNS(SVGNS, "path");
          ln.setAttribute("class", "ln");
          svgEl.appendChild(ln);
          const dt = document.createElementNS(SVGNS, "circle");
          dt.setAttribute("class", "dt");
          dt.setAttribute("r", "3.4");
          svgEl.appendChild(dt);
          PL.push({
            el,
            p,
            ln,
            lo,
            dt,
            cnt: el.querySelector(".cnt"),
            w: 0,
            h: 0,
            last: "",
          });
        });
        svgEl.appendChild(linkPath);
        requestAnimationFrame(() =>
          PL.forEach((q) => {
            q.w = q.el.offsetWidth;
            q.h = q.el.offsetHeight;
          }),
        );
      }
      function clearParts() {
        partsEl.innerHTML = "";
        svgEl.innerHTML = "";
        PL = [];
        plId = null;
      }
      let linkT = 0;
      function setPartsStep(k) {
        if (k !== plK) linkT = 0;
        plK = k;
        PL.forEach((q) =>
          q.el.classList.toggle("cur", k > 0 && q.p.link.includes(k)),
        );
      }

      /* =====================================================================================
   CAMERA RIG
   ===================================================================================== */
      const rig = {
        x: 0,
        y: 0,
        z: 0,
        dist: 84,
        pitch: DES.PITCH,
        yaw: 0,
        fov: DES.FOV,
        ox: 0,
        oy: 0,
      };
      const par = { x: 0, y: 0, tx: 0, ty: 0 };
      let flight = null;
      // обзор: камера подбирается так, чтобы проекция всего полотна (с перспективой) влезла в экран с полями
      const OV_PTS = [];
      MATS.forEach((m) => {
        OV_PTS.push(
          W3(m.x, m.y, m.ht),
          W3(m.x + m.w, m.y, m.ht),
          W3(m.x, m.y + m.h),
          W3(m.x + m.w, m.y + m.h),
        );
      });
      OV_PTS.push(
        W3(30, 10),
        W3(700, 1100),
        W3(1220, 1100),
        W3(1066, ROWS[2] + 192, 3.4),
      );
      const placeCam = (cam, tx, ty, tz, d, p, yw) => {
        const cp = Math.cos(p);
        cam.position.set(
          tx + Math.sin(yw) * cp * d,
          ty + Math.sin(p) * d,
          tz + Math.cos(yw) * cp * d,
        );
        cam.lookAt(tx, ty, tz);
        cam.updateMatrixWorld();
      };
      const ovCache = {};
      function fitOverview(asp) {
        const key = asp.toFixed(3);
        if (ovCache[key]) return ovCache[key];
        const cam = new THREE.PerspectiveCamera(DES.FOV, asp, 1, 900),
          v = new THREE.Vector3(),
          P = DES.PITCH,
          Y = DES.YAW;
        let tx = 0,
          tz = 0,
          d = 540 / DES.PX / Math.tan((DES.FOV / 2) * D2R);
        const mx = (22 / 1920) * 2,
          my = (16 / 1080) * 2;
        for (let it = 0; it < 8; it++) {
          placeCam(cam, tx, 0, tz, d, P, Y);
          cam.updateProjectionMatrix();
          let x0 = 1e9,
            x1 = -1e9,
            y0 = 1e9,
            y1 = -1e9;
          for (const p of OV_PTS) {
            v.copy(p).project(cam);
            x0 = Math.min(x0, v.x);
            x1 = Math.max(x1, v.x);
            y0 = Math.min(y0, v.y);
            y1 = Math.max(y1, v.y);
          }
          const s = Math.max(
            (x1 - x0) / (2 - 2 * mx),
            (y1 - y0) / (2 - 2 * my),
          );
          const hh = d * Math.tan((DES.FOV / 2) * D2R),
            hw = hh * asp,
            ox = ((x0 + x1) / 2) * hw,
            oz = (((y0 + y1) / 2) * hh) / Math.sin(P);
          // экранный сдвиг → сдвиг цели по столу с учётом поворота камеры
          tx += Math.cos(Y) * ox - Math.sin(Y) * oz;
          tz += -Math.sin(Y) * ox - Math.cos(Y) * oz;
          d *= s;
        }
        return (ovCache[key] = { x: tx, z: tz, dist: d });
      }
      const dOverview = () => fitOverview(innerWidth / innerHeight).dist;
      const shotOverview = () => {
        const f = fitOverview(innerWidth / innerHeight);
        return {
          x: f.x,
          y: 0,
          z: f.z,
          dist: f.dist,
          pitch: DES.PITCH,
          yaw: DES.YAW,
          fov: DES.FOV,
          ox: 0,
          oy: 0,
        };
      };
      // медленный дрейф камеры в покое обзора (±0,7° по азимуту, ±0,35° по наклону)
      const drift = { w: 0, t: 0 };
      // зона экрана под предмет: между заголовком и карточками цифр, левее панели пунктов (по реальной вёрстке панели)
      function zoneFor(id) {
        const u = Math.min(innerWidth / 1920, innerHeight / 1080),
          W = innerWidth,
          H = innerHeight;
        const el = ensurePane(id),
          head = el.querySelector(".fx-head"),
          pts = el.querySelector(".fx-pts");
        const low = el.querySelector(".fx-stats:not(.n0)"),
          notes = el.querySelector(".notes");
        let x0 = 70 * u,
          x1 = pts.offsetLeft - 46 * u,
          y0 = head.offsetTop + head.offsetHeight + 22 * u,
          y1 = H - 60 * u;
        if (id === "g") {
          x1 = W * 0.5;
          y1 = H - 70 * u;
        } else if (low) y1 = low.offsetTop - 22 * u;
        else if (notes) y1 = notes.offsetTop - 18 * u;
        if (id === "11") {
          y0 -= 10 * u;
        }
        return {
          cx: (x0 + x1) / 2,
          cy: (y0 + y1) / 2,
          w: x1 - x0,
          h: Math.max(120, y1 - y0),
          W,
          H,
        };
      }
      function shotFocus(id) {
        const o = OBJ[id],
          f = o.focus,
          z = zoneFor(id);
        o.root.updateMatrixWorld(true);
        const c = o.root.localToWorld(f.c.clone()); // root, а не inner: без временных подъёмов и падений
        const FV = f.fov || DES.FOV_F,
          tanV = Math.tan((FV / 2) * D2R),
          yaw = f.yaw * D2R,
          pit = f.pitch * D2R;
        const sc = o.root.scale.x,
          [bw, bh, bd] = f.box.map((v) => v * sc),
          cy = Math.abs(Math.cos(yaw)),
          sy = Math.abs(Math.sin(yaw));
        const hw = 0.5 * (bw * cy + bd * sy),
          dep = 0.5 * (bd * cy + bw * sy);
        const hh = 0.5 * bh * Math.cos(pit) + dep * Math.sin(pit);
        const dist =
          Math.max(
            hw / ((tanV * (z.W / z.H) * z.w) / z.W),
            hh / ((tanV * z.h) / z.H),
          ) *
            1.06 +
          dep * Math.cos(pit) * 0.5;
        return {
          x: c.x,
          y: c.y,
          z: c.z,
          dist,
          pitch: f.pitch * D2R,
          yaw: f.yaw * D2R,
          fov: FV,
          ox: 0.5 - z.cx / z.W,
          oy: 0.5 - z.cy / z.H,
        };
      }
      function flyTo(b, dur = 1.2) {
        const a = { ...rig },
          travel = Math.hypot(b.x - a.x, b.z - a.z);
        const hop =
          a.fov > 13.5 && b.fov > 13.5 ? clamp(travel / 26, 0, 0.5) : 0;
        flight = { a, b, t: 0, dur, hop };
      }
      function stepFlight(dt) {
        if (!flight) return;
        flight.t += dt;
        const u = clamp01(flight.t / flight.dur),
          e = smoother(u),
          { a, b } = flight;
        for (const k of ["x", "y", "z", "pitch", "fov", "ox", "oy"])
          rig[k] = lerp(a[k], b[k], e);
        rig.yaw = lerpAng(a.yaw, b.yaw, e);
        rig.dist =
          Math.exp(lerp(Math.log(a.dist), Math.log(b.dist), e)) *
          (1 + flight.hop * Math.sin(Math.PI * u));
        if (u >= 1) {
          flight = null;
          if (landPending && !cine) {
            landPending = null;
            onLand();
          }
        }
      }
      function applyCam() {
        const W = innerWidth,
          H = innerHeight;
        const dy = drift.w * Math.sin((drift.t * 2 * Math.PI) / 24) * 0.7 * D2R,
          dp =
            drift.w * Math.sin((drift.t * 2 * Math.PI) / 33 + 1) * 0.35 * D2R;
        const p = clamp(rig.pitch + par.y + dp, 4 * D2R, 82 * D2R),
          yw = rig.yaw + par.x + dy;
        camera.fov = rig.fov;
        camera.aspect = W / H;
        placeCam(camera, rig.x, rig.y, rig.z, rig.dist, p, yw);
        if (Math.abs(rig.ox) > 1e-5 || Math.abs(rig.oy) > 1e-5)
          camera.setViewOffset(W, H, rig.ox * W, rig.oy * H, W, H);
        else {
          if (camera.view && camera.view.enabled) camera.clearViewOffset();
          camera.updateProjectionMatrix();
        }
        camera.updateMatrixWorld();
      }
      const raycaster = new THREE.Raycaster(),
        ndc = new THREE.Vector2(),
        GROUND = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.3);
      function groundAt(sx, sy) {
        ndc.set((sx / innerWidth) * 2 - 1, -(sy / innerHeight) * 2 + 1);
        raycaster.setFromCamera(ndc, camera);
        return raycaster.ray.intersectPlane(GROUND, new THREE.Vector3());
      }
      function hitAt(sx, sy) {
        ndc.set((sx / innerWidth) * 2 - 1, -(sy / innerHeight) * 2 + 1);
        raycaster.setFromCamera(ndc, camera);
        const h = raycaster.intersectObjects(HITS, false)[0];
        return h ? h.object.userData.id : null;
      }

      /* free navigation */
      const free = { tx: 0, tz: 0, d: 84, vx: 0, vz: 0, anchor: null };
      // границы свободной навигации зависят от дистанции: чем дальше камера, тем меньше свобода; на максимальном
      // отдалении полотно центрируется, пустого экрана не бывает
      const CANVAS_HALF = {
        x: 960 / DES.PX + 0.4,
        z: 540 / (DES.PX * Math.sin(DES.PITCH)) + 0.4,
      };
      function freeBounds(d) {
        const ov = fitOverview(innerWidth / innerHeight),
          hh = d * Math.tan((DES.FOV / 2) * D2R),
          hw = (hh * innerWidth) / innerHeight;
        return {
          cx: ov.x,
          cz: ov.z,
          bx: Math.max(0, CANVAS_HALF.x - hw * 0.95),
          bz: Math.max(0, CANVAS_HALF.z - (hh / Math.sin(DES.PITCH)) * 0.95),
        };
      }
      function clampFree(hard, dt) {
        const b = freeBounds(free.d),
          x = clamp(free.tx, b.cx - b.bx, b.cx + b.bx),
          z = clamp(free.tz, b.cz - b.bz, b.cz + b.bz);
        if (hard) {
          free.tx = x;
          free.tz = z;
        } else {
          free.tx = damp(free.tx, x, 9, dt);
          free.tz = damp(free.tz, z, 9, dt);
        }
      }
      function stepFree(dt) {
        if (!drag.on) {
          free.tx += free.vx * dt;
          free.tz += free.vz * dt;
          const f = Math.exp(-4.2 * dt);
          free.vx *= f;
          free.vz *= f;
        }
        const zooming = Math.abs(rig.dist - free.d) > 0.02 && free.anchor;
        const before = zooming ? groundAt(free.anchor.x, free.anchor.y) : null;
        rig.dist = damp(rig.dist, free.d, 11, dt);
        rig.pitch = damp(rig.pitch, DES.PITCH, 7, dt);
        rig.yaw = lerpAng(rig.yaw, DES.YAW, 1 - Math.exp(-5 * dt));
        rig.fov = damp(rig.fov, DES.FOV, 6, dt);
        rig.ox = damp(rig.ox, 0, 7, dt);
        rig.oy = damp(rig.oy, 0, 7, dt);
        rig.y = damp(rig.y, 0, 7, dt);
        rig.x = free.tx;
        rig.z = free.tz;
        if (before) {
          applyCam();
          const after = groundAt(free.anchor.x, free.anchor.y);
          if (after) {
            free.tx += before.x - after.x;
            free.tz += before.z - after.z;
          }
        }
        clampFree(false, dt);
        rig.x = free.tx;
        rig.z = free.tz;
      }

      /* =====================================================================================
   LIGHT · DOF · SHADOW FRUSTUM
   ===================================================================================== */
      const lit = {
        m: 0,
        t: 0,
        dark: 0,
        darkT: 0,
        spot: new THREE.Vector3(),
        yaw: 0,
        rate: 3.0,
        spotMul: 1,
      };
      const kd = new THREE.Vector3(),
        Y_AXIS = new THREE.Vector3(0, 1, 0);
      const BG_INTRO = new THREE.Color(0x1b1b1a),
        FLOOR_INTRO = new THREE.Color(0x4a4a48),
        MAT_INTRO = new THREE.Color(0x6c6c69);
      let focusId = null;
      const SPOT_I = 4.6;
      function stepLight(dt) {
        lit.m = damp(lit.m, lit.t, lit.rate, dt);
        lit.dark = damp(lit.dark, lit.darkT, lit.rate, dt);
        const m = lit.m,
          ms = smoother(clamp01(m));
        // интро: студия тёмная (lit.dark = 1), прожектор на переключателе; дальше обзор ↔ фокус без «вспышек»
        const dk = smoother(clamp01(lit.dark));
        scene.environmentIntensity =

        key.intensity = lerp(lerp(2.7, 1.25, ms), 0.12, dk);

        uMat.value.lerpColors(MAT_L, MAT_D, ms).lerp(MAT_INTRO, dk);
        uFloor.value.lerpColors(FLOOR_L, FLOOR_D, ms).lerp(FLOOR_INTRO, dk);
        // прожектор следует за предметом
        if (focusId) {
          const o = OBJ[focusId];
          const c = o.inner.localToWorld(o.focus.c.clone());
          lit.spot.lerp(c, 1 - Math.exp(-5 * dt));
          lit.yaw = damp(lit.yaw, o.focus.yaw * D2R, 4, dt);
        }
        const a = lit.yaw - 32 * D2R;

      }
      scene.add(rim.target);

      /* ---------- пробег блика и отражения окружения в фокусе ---------- */
      // при посадке камеры отражение софтбокса проходит по предмету: поворот окружения с возвратом (0,9 с туда, 1,8 с назад);

      const sweep = { t: -1, A: 1.6, k: 1 };
      let landPending = null,
        cubeDue = -1,
        cubeFor = null;
      // снимок окружения — по одной грани за кадр (6 кадров), чтобы посадка камеры шла без рывка; all — все грани сразу
      const cubeJob = { face: -1, id: null, all: false };
      function captureCube(all = false) {

          renderer.setRenderTarget(rt);
          renderer.setMRT(mrt);

            .slice(-11)
            .concat(+(performance.now() - t0).toFixed(1));

          spot.shadow.autoUpdate = su;

      function onLand() {

      const tmpV = new THREE.Vector3();

      /* =====================================================================================
   STORY · NAVIGATION · HASH
   ===================================================================================== */
      const STEPS = [{ b: null }];

      let cine = null,

        view = "focus";
        const finale = fresh && id === "g" && k === 0 && !noCine;
        if (!finale) cine = null;

        if (fresh) {

      /* =====================================================================================
   INPUT

      const drag = {

      const DMIN = () => dOverview() * 0.2,

      window.addEventListener("pointerdown", (e) => {

      function syncOverlay(dt) {
        const W = innerWidth,
          H = innerHeight;
        const k =

        let best = null,
          bestD = 1e9,
          zoomBudget = 3,
          wcBudget = 3; // смена zoom пересобирает текст — не больше трёх подписей за кадр

        const holdIn =
          flight && view === "overview" && flight.t / flight.dur < 0.62;

          const want = holdIn ? 0 : w.want;

            if (!w.hidden) {

            continue;

          if (w.hidden) {
            w.el.classList.remove("off");
            w.hidden = false;

          if (d < 1) {

          // гаснущая подпись не масштабируется вслед за камерой: иначе браузер каждый кадр заново растрирует крупный текст

            if (!w.sFade) w.sFade = s;
            s = w.sFade;
          } else w.sFade = 0;

          // чтобы текст заново растрировался и был резким на любом масштабе

            w.s = s;
            w.z.style.zoom = s.toFixed(4);

          else w.still = (w.still || 0) + 1;
          w.ps = s;
          let zoomed = false;
          if (
            w.still > 4 &&
            zoomBudget > 0 &&
            Math.abs(s - w.s) > (drift.w > 0.05 ? 0.006 : 0.0008)
          ) {

            w.z.style.zoom = s.toFixed(4);

          }

          // в перелёте слой подписи масштабируется как картинка (will-change), в покое — снова живой текст с zoom

            (Math.abs(r - 1) > 1e-4 ? ` scale(${r.toFixed(4)})` : "");

        ALL.forEach((o) => {
          o.setState("overview", 0, false);
          o.lift.snap(0);
        });
        WL.forEach((w) => {
          w.want = 0;
          w.a = 0;
        });
        const c = o1.inner.localToWorld(new THREE.Vector3(0, 0.35, 0));
        const off = fast ? 1.3 : 0;
        Object.assign(rig, {
          x: c.x,
          y: c.y,
          z: c.z,
          dist: 21,
          pitch: 24 * D2R,
          yaw: -40 * D2R,
          fov: DES.FOV_F,
          ox: 0,
          oy: 0,
        });
        lit.t = lit.m = 1;
        lit.dark = lit.darkT = 1;
        lit.spot.copy(c);
        lit.yaw = -30 * D2R;
        const p1 = o1.root.position;
        ALL.forEach((o) => {
          if (o === o1) {
            o.drop.snap(0);
            o.inner.visible = true;
            return;
          }
          o.inner.visible = false;
          o.dropAt =
            off + 1.7 + Math.min(1.1, o.root.position.distanceTo(p1) / 26);
          o.drop.snap(2.4);
        });
        OBJ.hero.gain.snap(-2.0);
        intro = {
          t: off,
          ci: fast ? 4 : 0,
          target: target || 0,
          flew: false,
          lights: false,
        };
        writeHash();
        hud();
      }
      function stepIntro(dt) {
        const I = intro,
          o1 = OBJ["1"];
        I.t += dt;
        const T = I.t;
        // прожектор «щёлкает» и включается, затем четыре щелчка переключателя
        lit.spotMul = T < 0.18 ? 0 : Math.min(1, lit.spotMul + dt * 9);
        const clicks = [0.45, 0.78, 1.11, 1.44];
        while (I.ci < 4 && T >= clicks[I.ci]) {
          I.ci++;
          o1.setCum(I.ci);
        }
        if (!I.flew) {
          rig.yaw = lerp(-40, -28, smoother(clamp01(T / 1.65))) * D2R;
          rig.dist = lerp(21, 19, smoother(clamp01(T / 1.65)));
        }
        // студийный свет включается ступенями: верхний софтбокс, затем остальное
        if (T >= 1.62 && !I.lights) {
          I.lights = 1;
          lit.rate = 14;
          lit.t = 0.5;
          lit.darkT = 0.45;
        }
        if (T >= 1.84 && I.lights === 1) {
          I.lights = 2;
          lit.t = 0;
          lit.darkT = 0;
        }
        if (T >= 2.2 && I.lights === 2) {
          I.lights = 3;
          lit.rate = 3;
        }
        if (T >= 1.64 && !I.flew) {
          I.flew = true;
          flyTo(shotOverview(), 1.85);
        }
        if (T >= 1.95) OBJ.hero.gain.t = 1.3;
        ALL.forEach((o) => {
          if (o.dropAt != null && T >= o.dropAt && !o.inner.visible) {
            o.inner.visible = true;
            o.drop.t = 0;
          }
        });
        WL.forEach((w, i) => {
          const at =
            2.85 +
            (w.kind === "hero"
              ? 0
              : w.kind === "grp"
                ? 0.15
                : w.kind === "foot"
                  ? 0.5
                  : 0.1 + (w.anchor.z + 10) * 0.02 + (w.anchor.x + 15) * 0.006);
          if (T >= at) w.want = 1;
        });
        if (T >= 3.6 && !flight) endIntro();
      }
      function endIntro() {
        if (!intro) return;
        const target = intro.target;
        intro = null;
        ALL.forEach((o) => {
          o.inner.visible = true;
          o.drop.snap(0);
          o.dropAt = null;
        });
        OBJ.hero.gain.t = 1.3;
        OBJ["1"].auto = true;
        lit.rate = 3;
        lit.spotMul = 1;
        lit.darkT = 0;
        WL.forEach((w) => {
          w.want = 1;
        });
        view = "overview";
        flight = null;
        Object.assign(rig, shotOverview());
        lit.t = 0;
        cur = target || 0;
        if (cur > 0) {
          noCine = true;
          apply();
          noCine = false;
        } else {
          toOverview();
          flight = null;
          Object.assign(rig, shotOverview());
          writeHash();
          hud();
        }
        showHint(3000);
        srcBtn.classList.add("on");
      }

      /* =====================================================================================
   LOOP
   ===================================================================================== */
      const dbgEl = document.getElementById("dbg");
      if (DEBUG) dbgEl.style.display = "block";
      let last = performance.now(),
        T = 0,
        fpsN = 0,
        fpsT = 0,
        fpsV = 0,
        lastWheel = 0;
      // статистика: интервалы между отрисованными кадрами и время работы JS в кадре
      const ST = { iv: [], all: [], cpu: [], dprT: 0, cool: 0 };
      const pct = (arr, q) => {
        if (!arr.length) return 0;
        const a = arr.slice().sort((x, y) => x - y);
        return a[Math.min(a.length - 1, Math.floor(a.length * q))];
      };
      const camStill = () =>
        !flight &&
        !cine &&
        !intro &&
        !drag.on &&
        performance.now() - lastWheel > 700 &&
        (view !== "free" ||
          (Math.abs(rig.dist - free.d) < 0.02 &&
            Math.hypot(free.vx, free.vz) < 0.05));
      // адаптация DPR в обе стороны с гистерезисом, шаг 0,25: понижаем, только если кадры стабильно не успевают
      // за лимит 60 fps, повышаем после 20 с ровных кадров; меняем, только когда камера стоит
      function adaptDPR(dt) {
        if (UNCAP || Q.has("dpr") || document.hidden) return;
        ST.dprT += dt;
        if (ST.dprT < 3 || !camStill() || ST.iv.length < 120) return;
        ST.dprT = 0;
        // p85 > 20 мс два окна подряд — кадры стабильно не успевают (единичные опоздания из-за частот GPU не в счёт)
        const slow = pct(ST.iv, 0.85) > 20,
          fast = pct(ST.iv, 0.95) < 17.6,
          now = performance.now();
        ST.slowN = slow ? (ST.slowN || 0) + 1 : 0;
        let nd = DPR;
        if (ST.slowN >= 2 && DPR > 1) {
          nd = DPR - 0.25;
          ST.cool = now + 20000;
          ST.slowN = 0;
        } else if (fast && DPR < DPR_MAX && now > ST.cool) {
          nd = DPR + 0.25;
          ST.cool = now + 8000;
        }
        if (nd !== DPR) {
          DPR = nd;
          renderer.setPixelRatio(DPR);
          ST.iv.length = 0;
          ST.cpu.length = 0;
        }
      }
      function frame() {
        const now = performance.now();
        // ограничение 60 fps: на ProMotion (120 Гц) рисуем каждый второй кадр — ровный темп и меньше нагрев
        if (!UNCAP && now - last < 1000 / 60 - 3.2) return;
        const raw = now - last,
          dt = Math.min(0.05, raw / 1000) * TIME_SCALE;
        last = now;
        T += dt;
        // для адаптации DPR — только кадры устоявшегося состояния: камера стоит, нет съёмки окружения и пробега блика
        ST.all.push(raw);
        if (ST.all.length > 200) ST.all.shift();
        if (camStill() && cubeJob.face < 0 && sweep.t < 0) {
          ST.iv.push(raw);
          if (ST.iv.length > 200) ST.iv.shift();
        } else ST.iv.length = 0;
        if (intro) stepIntro(dt);
        stepFlight(dt);
        stepCine(dt);
        drift.t += dt;
        drift.w = damp(
          drift.w,
          view === "overview" && !flight && !intro && !drag.on ? 1 : 0,
          drift.w < 0.5 ? 0.6 : 4,
          dt,
        );
        if (view === "free") stepFree(dt);
        const pm = view === "focus" ? 1.8 : view === "free" ? 0 : 1.0;
        par.tx =
          -(mouse.x / innerWidth - 0.5) * 2 * pm * D2R +
          (view === "focus" ? Math.sin(T * 0.21) * 1.1 * D2R : 0);
        par.ty = (mouse.y / innerHeight - 0.5) * 2 * pm * 0.55 * D2R;
        par.x = damp(par.x, par.tx, 2.2, dt);
        par.y = damp(par.y, par.ty, 2.2, dt);
        applyCam();
        stepLight(dt);
        stepSweep(dt);
        updateDOF();
        updateHover();
        for (const o of ALL) o.tick(dt, T);
        cable.tick(dt);
        // все тени — каждый кадр: при чередовании тень движущегося предмета обновлялась на 30 Гц, отставала от него
        // на кадр, а тени ключа и контактные — в противофазе; при анимации это читалось как моргание
        key.shadow.autoUpdate = true;
        spot.shadow.autoUpdate = spot.intensity > 0.01;
        renderContactShadows();
        uFrame.value = (uFrame.value + 1) % 997;
        pipe.render();
        ST.cpu.push(performance.now() - now);
        if (ST.cpu.length > 200) ST.cpu.shift();
        syncOverlay(dt);
        adaptDPR(dt);
        fpsN++;
        fpsT += raw / 1000;
        if (fpsT >= 0.5) {
          fpsV = fpsN / fpsT;
          fpsN = 0;
          fpsT = 0;
          if (DEBUG) {
            const fx = [
              FX.ao && "GTAO",
              FX.bloom && "bloom",
              uSSR.value > 0.01 && "SSR",
              uCube.value > 0.01 && "cube",
              winLight.intensity > 0.01 && "окно",
              sweep.t >= 0 && "блик",
              "DOF",
              "VSM",
            ]
              .filter(Boolean)
              .join(" · ");
            dbgEl.textContent = `${fpsV.toFixed(0)} fps · кадр p50 ${pct(ST.all, 0.5).toFixed(1)} · p95 ${pct(ST.all, 0.95).toFixed(1)} ms\nJS кадра p95 ${pct(ST.cpu, 0.95).toFixed(1)} ms\nDPR ${DPR.toFixed(2)} · ${renderer.domElement.width}×${renderer.domElement.height} · ${renderer.backend.isWebGPUBackend ? "WebGPU" : "WebGL2"}${UNCAP ? " · без лимита" : " · 60 fps"}\n${fx}\n${view}${focusId ? " · " + focusId : ""} · step ${cur}`;
          }
        }
      }
      window.addEventListener(
        "wheel",
        () => {
          lastWheel = performance.now();
        },
        { passive: true },
      );

      /* =====================================================================================
   BOOT
   ===================================================================================== */
      await Promise.race([
        Promise.all(
          [
            '600 20px "Inter Tight"',
            '700 20px "Inter Tight"',
            '400 20px "Inter"',
            '500 20px "Inter"',
            '600 20px "Inter"',
            '500 12px "JetBrains Mono"',
            '600 12px "JetBrains Mono"',
            '700 12px "JetBrains Mono"',
          ].map((f) => document.fonts.load(f, "Рабочий процесс AI 0123")),
        ),
        new Promise((r) => setTimeout(r, 4000)),
      ]);
      drawSilk();
      window.__ld && window.__ld(3);
      // прогрев под заставкой: рендер всех состояний (обзор, каждый фокус с SSR, прозрачность листов, интро) собирает
      // шейдеры всех материалов и эффектов. Сборка TSL → WGSL — ~11 мс CPU на материал и привязана к контексту рендера
      // (id контекста входит в ключ кэша), поэтому греем настоящим кадром: scenePass.compileAsync() в r186 собирает
      // в контексте вложенности 0, а проход сцены рисуется внутри конвейера на глубине 2 — такой прогрев пропадал зря (~1,4 с).
      // Грани CubeCamera рисуются в контексте прохода (renderCubeFaces) — снимок окружения добавляет лишь фон, копию и PMREM
      {
        // шаг прогрева — новый кадр: проход сцены, тени и эффекты обновляются раз за кадр (NodeUpdateType.FRAME), а номер
        // кадра растёт во внутреннем цикле рендерера по rAF — после setTimeout повторный рендер их бы пропустил
        const tick = () => new Promise((r) => requestAnimationFrame(r));
        Object.assign(rig, shotOverview());
        applyCam();
        const hidden = [];
        scene.traverse((o) => {
          if ((o.isMesh || o.isLineSegments) && !o.visible) {
            hidden.push(o);
            o.visible = true;
          }
        });
        spot.intensity = 1;
        winLight.intensity = 0.5;
        lit.spot.set(0, 0, 0);
        uSSR.value = 1;
        uCube.value = 0.5;
        renderContactShadows();
        pipe.render();
        await tick();
        const b0 = OBJ["11"].bars[0];
        b0.top.material = OBJ["11"].pageMats[1];
        for (const id of ORDER) {
          Object.assign(rig, shotFocus(id));
          applyCam();
          lit.spot.copy(OBJ[id].root.localToWorld(OBJ[id].focus.c.clone()));
          stepLight(0);
          spot.intensity = 1;
          renderContactShadows();
          pipe.render();
          await tick();
        }
        b0.top.material = OBJ["11"].pageMats[0];
        focusId = "5";
        captureCube(true);
        pipe.render();
        await tick();
        focusId = null;
        cubeFor = null;
        lit.dark = 1;
        stepLight(0);
        spot.intensity = 1;
        pipe.render();
        await tick();
        lit.dark = 0;
        hidden.forEach((o) => {
          o.visible = false;
        });
        uSSR.value = 0;
        uCube.value = 0;
        // сцену показываем, когда GPU доделал прогрев: иначе первые кадры интро ждут компиляции пайплайнов
        if (renderer.backend.isWebGPUBackend)
          await renderer.backend.device.queue.onSubmittedWorkDone();
      }
      window.__ld && window.__ld(4);
      computeDref();
      const hashTarget = parseHash();
      startIntro(hashTarget, hashTarget > 0);
      renderer.domElement.classList.add("on");
      document.getElementById("loader").classList.add("out");
      last = performance.now();
      renderer.setAnimationLoop(frame);
      window.__app = {
        shotFocus,
        flyTo,
        get flight() {
          return flight;
        },
        go,
        STEPS,
        cable,
        get cur() {
          return cur;
        },
        get view() {
          return view;
        },
        rig,
        OBJ,
        endIntro,
        enterFree,
        free,
        BLK,
        WL,
        PODS,
        MATS,
        ST,
        FX,
        get DPR() {
          return DPR;
        },
        get dbg() {
          return {
            cubeMs: cubeJob.ms,
            cube: cubeJob.face,
            sweep: +sweep.t.toFixed(2),
            ssr: +uSSR.value.toFixed(2),
            cubeMix: +uCube.value.toFixed(2),
            flight: !!flight,
          };
        },
        camera,
        scene,
        renderer,
        uniforms: { uSSR, uCube, uBloom, uAO },
      };
    </script>
  </body>
</html>
